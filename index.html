    }
    const v = (selector,value) => {
      if (value == null || editedFields.has(selector.slice(1))) return;
      const input = $(selector);
      if (!input.value) input.value = value;
    };
    const chips = (selector,values) => {
      if (editedFields.has(selector.slice(1))) return;
      for (const chip of form.querySelectorAll(`${selector} [data-v]`)) {
        chip.setAttribute("aria-pressed",String(values.includes(chip.dataset.v)));
      }
    };
    const oldSource = $("#f-src").value || p.source;
    for (const key of catalogFields) {
      if (["memo","own","triedOn"].includes(key) || !(key in profile)) continue;
      if (key === "fragranticaRating" && fromCodex && oldSource &&
          fragranticaId(oldSource) !== fragranticaId(profile.source)) continue;
      if (!["brand","name","conc"].includes(key) && (fromCodex || (!explicit && codexResolved)) &&
          p[key] != null && p[key] !== "" && !(Array.isArray(p[key]) && !p[key].length)) continue;
      if (!explicit && (profile[key] == null || profile[key] === "")) continue;
      p[key] = profile[key];
    }
    originalKey = versionKey(p);
    if (p.brand) $("#f-brand").value = p.brand;
    if (p.name) $("#f-name").value = p.name;
    if (p.conc && ![...$("#f-conc").options].some(option => option.value === p.conc)) {
      $("#f-conc").add(new Option(concentrationLabel(p.conc),p.conc));
    }
    $("#f-conc").value = p.conc || "";
    $("#f-lookup").href = fragranticaSearch(p.brand,p.name);
    v("#f-src",p.source);
    $("#f-src-preview").innerHTML = frigPhotoPreview();
    $("#f-src-hint").textContent = srcHint($("#f-src").value);
    v("#f-score",formattedCommunityScore(p));
    v("#f-str",p.strength);
    v("#f-lon",p.longevity);
    const notes = splitNotes(p.notes);
    for (const [key] of NOTE_FIELDS) v("#f-note-"+key,notes[key]);
    chips("#f-fam",p.accords?.length ? p.accords.map(([key]) => key) : p.families || []);
    chips("#f-sea",Object.keys(p.seasons || {}).filter(key => p.seasons[key] >= NEUTRAL_SUITABILITY));
    chips("#f-occ",p.occ?.length ? p.occ : suggestOcc(p));
    updateDuplicate(identity());
    if (fromCodex) codexResolved = true;
    return true;
  };
  wireCatalogSearch(formIsOpen,acceptDraft);
  const pendingCodex = wireCodexLookup(form,formIsOpen,identity,acceptDraft);
  function frigPhotoPreview(){
    const source = $("#f-src").value;
    return source || p.catalogImage ? photo(source === (p.source || "") ? p : {source},"ph-sm") : "";
  }
  function updateDuplicate(requested){
    const notice = $("#f-duplicate");
    if (!notice) return;
    const matched = matchingBottle(requested);
    const submit = form.querySelector('[type="submit"]');
    notice.innerHTML = duplicateNotice(matched);
    notice.hidden = !matched;
    submit.dataset.duplicate = matched?.id || "";
    submit.textContent = matched ? "再新增一瓶" : "新增香水";
  }
  const report = message => {
    if (!versionStatus) return;
    versionStatus.textContent = message;
    versionStatus.hidden = !message;
  };
  function prepareVersion(requested){
    const key = versionKey(requested);
    if (key === originalKey) { pending = null; report(""); return null; }
    if (pending?.key === key) return pending.job;
    report("正在查詢對應版本…");
    const otherVersions = [...new Set(versionOptions(requested)
      .filter(item => versionKey(item) !== key).map(item => concentrationLabel(item.conc)))];
    const hint = otherVersions.length ? ` 同名已核對的版本有${otherVersions.join("、")}。` : "";
    const request = {key};
    pending = request;
    request.job = lookupPerfumeVersion(requested).then(version => {
      if (formIsOpen() && versionKey(identity()) === key) {
        report(version ? `找到 ${version.name} · ${version.conc}，儲存後更新版本資料。` :
          `目前找不到同名的${concentrationLabel(requested.conc)}，原版資料會保留。${hint}`);
      }
      return version;
    }).catch(() => {
      if (formIsOpen() && versionKey(identity()) === key) report("暫時無法查詢版本，請再按一次儲存重試。" + hint);
      return null;
    }).then(version => {
      if (!version && pending === request) pending = null;
      return version;
    });
    return request.job;
  }
  form.addEventListener("input", e => {
    editedFields.add(e.target.id);
    if (e.target.id === "f-src") {
      const url = e.target.value.trim();
      $("#f-src-preview").innerHTML = fragranticaId(url) ? photo({source:url}, "ph-sm", "eager") : "";
      $("#f-src-hint").textContent = srcHint(url);
      const rating = Store.bundle?.ratings?.[fragranticaId(url)];
      if (rating && !$("#f-score").value) $("#f-score").placeholder = String(rating);
      updateDuplicate(identity());
    }
    if (e.target.id === "f-brand" || e.target.id === "f-name" || e.target.id === "f-conc") {
      $("#f-lookup").href = fragranticaSearch($("#f-brand").value,$("#f-name").value);
      if (versionKey(identity()) !== pending?.key) report("");
      updateDuplicate(identity());
    }
  });
  form.addEventListener("click", e => {
    const group = e.target.closest("#f-fam, #f-sea, #f-occ");
    if (group && e.target.closest("button")) editedFields.add(group.id);
  });
  form.addEventListener("change", e => {
    if ((lookupEdition || p.conc) && ["f-brand","f-name","f-conc"].includes(e.target.id)) prepareVersion(identity());
  });
  form.addEventListener("invalid", e => {
    const group = e.target.closest("details");
    if (group) group.open = true;
  }, true);
  form.addEventListener("submit", async e => {
    e.preventDefault();
    const requested = identity();
    const suffix = searchText(requested.name).match(VERSION_SUFFIX)?.[1];
    if (suffix && requested.conc && catalogConc(suffix) !== catalogConc(requested.conc)) {
      report("品名裡的濃度與下拉選擇不同，請確認版本。");
      return;
    }
    const key = versionKey(requested);
    const submit = form.querySelector('[type="submit"]');
    if (submit.disabled) return;
    submit.disabled = true;
    try {
      const changed = (lookupEdition || p.conc) && key !== originalKey;
      const version = changed ? await prepareVersion(requested) : null;
      if (!formIsOpen() || versionKey(identity()) !== key || (changed && !version)) return;
      if (!id && (matchingBottle(requested)?.id || "") !== submit.dataset.duplicate) {
        updateDuplicate(requested);
        return;
      }
      await submitForm(p,version,pendingCodex() || (codexResolved && !changed ? false : null));
    } finally {
      submit.disabled = false;
    }
  });
}
async function submitForm(orig,version,codexJob=null){
  const v = id => $(id).value.trim();
  const n = id => { const value = $(id).valueAsNumber; return Number.isFinite(value) ? value : null; };
  const picked = sel => [...document.querySelectorAll(sel+" .chip[aria-pressed='true']")].map(b => b.dataset.v);
  const brand = v("#f-brand"), name = v("#f-name");
  if (!brand || !name) { toast("請填品牌和名稱"); return; }
  const id = orig.id || ("p" + Date.now().toString(36));
  const selected = picked("#f-fam");
  const oldAccords = orig.accords || [];
  const keptAccords = oldAccords.filter(([key]) => selected.includes(key));
  const weightedKeys = oldAccords.map(([key]) => key);
  const families = oldAccords.length
    ? [...keptAccords.map(([key]) => key), ...selected.filter(key => !weightedKeys.includes(key))].slice(0,3)
    : selected;
  // 只更新使用者變更勾選狀態的季節或時段。
  const seaOn = new Set(picked("#f-sea")), seasons = {...orig.seasons};
  for (const key of Object.keys(SEASON)) {
    const wasOn = num(seasons[key],0) >= NEUTRAL_SUITABILITY, on = seaOn.has(key);
    if (on !== wasOn) seasons[key] = on ? 85 : 40;
  }
  const noteEntries = NOTE_FIELDS.map(([key,label]) => [label,v("#f-note-"+key)]).filter(([,value]) => value);
  const notes = noteEntries.length === 1 && noteEntries[0][0] === "整體香調" ? noteEntries[0][1] :
    noteEntries.map(([label,value]) => label + "：" + value).join("｜");
  const p = Object.assign({}, orig, {id, brand, name, conc:v("#f-conc"), notes,
    accords:keptAccords, families, seasons:Object.keys(seasons).length ? seasons : undefined,
    seasonDataVersion:SEASON_DATA_VERSION, occ:picked("#f-occ"),
    strength:n("#f-str"), longevity:n("#f-lon"), fragranticaRating:n("#f-score"),
    memo:v("#f-memo"), source:v("#f-src")});
  const own = document.querySelector("#f-own .chip[aria-pressed='true']")?.dataset.v || "";
  if (own) { p.own = own; if (own === "tried") p.triedOn = $("#f-tried").value || TODAY; else delete p.triedOn; }
  else { delete p.own; delete p.triedOn; }
  if (version) applyPerfumeVersion(p,version);
  // 換了 Fragrantica 網址就重新對應網站的完整資料
  if ((orig.source || "") !== p.source) {
    delete p.detailsVer;
    delete p.bottleCutout;
  }
  const message = orig.id ? "已儲存" : own === "wish" ? "已加入願望清單" : own === "tried" ? "已加入試香紀錄" : "已新增香水";
  await act(async () => {
    await Store.savePerfume(p, true);
    if (Store.bundle?.details?.[fragranticaId(p.source)]) { Store.applyDetails(Store.bundle); Store.save(); }
  }, message);
  detailSheet(id);
  if (!orig.id || version || p.source !== orig.source) {
    void enrichSavedPerfume(id).then(() => enrichBottlePhoto(id));
  }
  if (!orig.id && codexJob !== false) void enrichSavedWithCodex(id,codexJob);
}

async function enrichSavedWithCodex(id,pending=null,retry=false){
  const initial = byId(id), pair = codexPair();
  if (!initial?.brand || !initial.name || !pair || !codexNeedsData(initial)) return;
  const key = codexVersionKey(initial), previous = codexSavedState.get(id);
  if (previous?.key === key && (previous.pending || !retry)) return;
  const attempt = {key,pending:true,message:"Codex 正在補香水資料…"};
  codexSavedState.set(id,attempt);
  const show = message => {
    attempt.message = message;
    if (!viewingPerfume(id) || codexSavedState.get(id) !== attempt) return;
    const status = $("#codex-saved-status");
    const button = $("#sheet-scroll [data-act='codex-repair']");
    if (status) { status.textContent = message; status.hidden = !message; }
    if (button) button.disabled = attempt.pending;
  };
  show(attempt.message);
  try {
    let profiles = await (pending || readCodexPerfumes(pair,initial.name,"","")).catch(error => {
      if (!pending) throw error;
      return [];
    });
    if (!matchingCodexVersions(profiles,initial).length && codexVersionKey(byId(id) || {}) === key) {
      profiles = await readCodexPerfumes(pair,initial.name,initial.brand,codexIdentity(initial)[2]);
    }
    const profile = matchingCodexProfile(profiles,initial);
    const current = byId(id);
    if (!current || codexVersionKey(current) !== key || codexSavedState.get(id) !== attempt) return;
    if (!profile) {
      attempt.message = matchingCodexVersions(profiles,initial).length > 1 ?
        "有多個版本，請編輯這筆香水並選擇濃度。" : "Codex 目前找不到可核對的同款版本。";
      return;
    }
    const updated = {...current};
    for (const field of ["conc","notes","catalogSource","source","fragranticaRating","codexImage","codexImageSource"]) {
      if (updated[field] != null && updated[field] !== "") continue;
      if (!profile[field]) continue;
      if (field === "catalogSource" && updated.notes !== profile.notes) continue;
      if (field === "codexImageSource" && updated.codexImage !== profile.codexImage) continue;
      if (field === "fragranticaRating" && updated.source && fragranticaId(updated.source) !== fragranticaId(profile.source)) continue;
      if (["codexImage","codexImageSource"].includes(field) && (updated.photo || updated.catalogImage || updated.bottleCutout)) continue;
      updated[field] = profile[field];
    }
    if (JSON.stringify(updated) === JSON.stringify(current)) {
      attempt.message = "目前已帶入查到的資料。";
      return;
    }
    await Store.savePerfume(updated);
    attempt.key = codexVersionKey(updated);
    attempt.message = codexNeedsData(updated) ? "已帶入查到的資料，部分欄位仍待查。" : "";
    if (viewingPerfume(id)) {
      const scroll = $("#sheet-scroll").scrollTop;
      detailSheet(id);
      $("#sheet-scroll").scrollTop = scroll;
    }
    if (!updated.bottleCutout) void enrichBottlePhoto(id);
    toast("Codex 已補齊香水資料");
  } catch (error) {
    attempt.message = error.message === "busy" ? "Codex 正在查其他香水，等一下可以再補。" :
      "暫時連不到 Codex，確認 Tailscale 和電腦的橋接程式開著再試。";
  } finally {
    attempt.pending = false;
    if (codexVersionKey(byId(id) || {}) === attempt.key) show(attempt.message);
  }
}

async function enrichSavedPerfume(id){
  const initial = byId(id);
  if (!initial?.conc || initial.notes || initial.catalogSource) return;
  const requested = {...initial,brand:remoteCatalogQuery(initial.brand)};
  try {
    const profile = await lookupPerfumeVersion(requested);
    const current = byId(id);
    if (!profile?.notes || !current || current.source !== initial.source || versionKey(current) !== versionKey(initial)) return;
    const updated = {...current};
    for (const key of ["notes","catalogSource","catalogImage","catalogRevision","source","strength","longevity","fragranticaRating","seasons","votes"]) {
      if ((updated[key] === "" || updated[key] == null) && profile[key] != null) updated[key] = profile[key];
    }
    for (const key of ["families","accords","aliases"]) {
      if (!updated[key]?.length && profile[key]?.length) updated[key] = profile[key];
    }
    if (JSON.stringify(updated) === JSON.stringify(current)) return;
    await Store.savePerfume(updated);
    if (viewingPerfume(id)) {
      const scroll = $("#sheet-scroll").scrollTop;
      detailSheet(id);
      $("#sheet-scroll").scrollTop = scroll;
    }
    toast("已補齊查到的香水資料");
  } catch { /* The saved entry is available while the catalogue is offline. */ }
}

    const list = S.perfumes.filter(p => isOwned(p) && matchesCatalog(input.value,...catalogSearchFields(p))).sort(comparePerfumes);
    options.innerHTML = list.length ? list.map(p => `<button type="button" class="pickrow" data-wear-option="${esc(p.id)}"
      aria-pressed="${selected===p.id}" style="--c:${famColor(p)}"><i></i><span class="wear-option-name">${esc(p.name)}</span>
      <span class="small muted">${esc([p.brand,p.conc].filter(Boolean).join(" · "))}</span></button>`).join("") :
      '<span class="small muted" role="status">找不到符合的香水。</span>';
  }
  input.addEventListener("input",renderOptions);
  $("#day-time").addEventListener("input",updateSelection);

  options.addEventListener("click",e => {

    e.preventDefault();

  });
  renderOptions();
  updateSelection();

    if (form.isConnected) { renderPrefs(); toast("Codex 已配對"); }
  } catch (error) {
    show(error.message === "pair" ? "配對碼已失效，請使用最新的配對碼。" : "連不到電腦，請確認橋接程式已開啟。");
  } finally { button.disabled = false; }
});
document.addEventListener("input", e => {
  if (e.target.id !== "intent-input") return;
  S.intentInput = e.target.value;
  S.intentPreview = null;
  for (const element of e.target.form.querySelectorAll("[data-intent-preview]")) element.remove();
});
let delArm = null, importArm = null;
function confirmDelete(button, message){
  if (delArm?.button === button) {
    delArm = null;
    return true;
  }
  if (delArm?.button.isConnected) delArm.button.textContent = delArm.label;
  const armed = {button,label:button.textContent};
  delArm = armed;
  button.textContent = message;
  setTimeout(() => {
    if (delArm !== armed) return;
    delArm = null;
    if (button.isConnected) button.textContent = armed.label;
  }, 3500);
  return false;
}
document.addEventListener("click", async e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const a = b.dataset.act, v = b.dataset.v, id = b.dataset.id;
  switch (a) {
    case "codex-disconnect":
      lsSet(CODEX_PAIR,null); renderPrefs(); toast("已解除 Codex 配對");
      break;
    case "temp": S.ctx.temp = Math.max(-5, Math.min(42, S.ctx.temp + Number(v))); S.ctx.guessed = false; S.ctx.src = "manual"; S.ctx.manual = true; saveCtx(); resetRecommendationChoices(); render(); break;
    case "wet": S.ctx.wet = !S.ctx.wet; S.ctx.src = "manual"; S.ctx.manual = true; saveCtx(); resetRecommendationChoices(); render(); break;
    case "occ":
      if (S.ctx.occ !== v || S.ctx.intent?.occ) resetRecommendationChoices();
      if (S.ctx.intent?.occ) {
        delete S.ctx.intent.occ;
        if (!Object.keys(S.ctx.intent).length) delete S.ctx.intent;
      }
      S.ctx.occ = v; applyWeather(); saveCtx(); render();
      break;
    case "intent-apply": {
      const choices = new FormData(b.form);
      const selected = {};
      for (const [key,value] of intentConditions(S.intentPreview || {})) {
        if (!choices.getAll(key).includes(value)) continue;
        if (key === "prefer" || key === "avoid") (selected[key] ||= []).push(value);
        else selected[key] = value;
      }
      if (!Object.keys(selected).length) { toast("請至少選一個條件"); break; }
      S.ctx.intent = selected;
      S.intentPreview = null;
      applyWeather(); saveCtx(); resetRecommendationChoices(); renderToday();
      break;
    }
    case "intent-clear":
      delete S.ctx.intent;
      S.intentInput = ""; S.intentPreview = null;
      applyWeather(); saveCtx(); resetRecommendationChoices(); renderToday();
      break;
    case "autowx": S.ctx.manual = false; S.ctx.src = null; applyWeather(); saveCtx(); resetRecommendationChoices(); render(); break;
    case "shuffle":
    case "batch-shuffle": {
      if (a === "shuffle") S.offset++;
      else {
        const recs = recommend(TODAY,S.ctx);
        const current = recommendationOrder(recs).slice(0,RECOMMENDATION_BATCH_SIZE).map(row => row.p.id);
        const next = nextRecommendationBatch(recs,S.seenRecommendations,current);
        if (next.newCycle) S.seenRecommendations.clear();
        S.recommendationBatch = next.ids;
        S.offset = 0;
      }
      renderToday();
      if ($(".pick")?.getBoundingClientRect().top < 0) $(".pick").scrollIntoView({block:"start"});
      if (e.detail === 0) $(`[data-act="${a}"]`)?.focus({preventScroll:true});
      break;
    }
    case "sync": if (Sync.valid()) Sync.run(); else Sync.connect(); break;
    case "gd-stop": Sync.stop(); break;
    case "unphoto": {
      const p = byId(id);
      if (p) {
        bottleUploads.delete(id);
        const {photo,photoTransparent,...updated} = p;
        await Store.savePerfume(updated);
        detailSheet(id); toast("已改回原本圖片");
        void enrichBottlePhoto(id);
      }
      break;
    }
    case "wxrefresh": {
      if (Weather.busy) break;
      b.disabled = true; b.classList.add("spinning");
      const updated = await Weather.load(true);
      if (b.isConnected) { b.disabled = false; b.classList.remove("spinning"); }
      toast(updated ? `已更新：${todayWeather().place}` : "暫時抓不到天氣");
      break;
    }
    case "wear": {
      const p = byId(id);
      if (!availableToWear(p)) {
        toast(p?.remaining === "empty" ? "這支已用完，補貨後可再記錄" : "這支目前無法記錄");
        break;
      }
      if (Sync.on && !Sync.valid()) Sync.connect(); // 順便取得同步授權（要在點擊當下）
      closeSheet();
      const refill = wearsOn(TODAY).some(w => w.perfumeId === id);
      await act(() => Store.addWear({date:TODAY, time:nowTime(), perfumeId:id, occ:S.ctx.intent?.occ || S.ctx.occ, temp:S.ctx.temp, wet:!!S.ctx.wet}),
        refill ? `已記錄補香：${p.name}` : `已記錄：今天噴 ${p.name}`);
      if (S.view !== "today") location.hash = "today";
      break;
    }
    case "edit-wear": editDaySheet(v, id); break;
    case "del-wear":
      if (confirmDelete(b,"確定刪除？")) {
        await act(() => Store.deleteWear(id), "已刪除這筆紀錄");
        daySheet(v);
      }
      break;
    case "own": {
      const p = byId(id); if (!p) break;
      const q = Object.assign({}, p, {remaining:"full"}); delete q.own;
      await act(() => Store.savePerfume(q), `已加入香水櫃：${p.name}`);
      detailSheet(id);
      break;
    }
    case "tried": {
      const p = byId(id); if (!p) break;
      await act(() => Store.savePerfume(Object.assign({}, p, {own:"tried", triedOn:TODAY})), "已移到試香紀錄");
      detailSheet(id);
      break;
    }
    case "open":
      detailSheet(id); void enrichSavedWithCodex(id); break;
    case "codex-repair":
      void enrichSavedWithCodex(id,null,true); break;
    case "close": closeSheet(); break;
    case "edit": editSheet(id); break;
    case "compare": comparePicker(id ? [id,""] : undefined); break;
    case "new": editSheet(null); break;
    case "restock": {
      const p = byId(id);
      if (!p) break;
      if (p.remaining === "empty") await act(() => Store.savePerfume(remainingUpdate(p,"full")), "已補貨並恢復推薦");
      detailSheet(id);
      break;
    }
    case "rate": { const p = byId(id); if (p) { await act(() => Store.savePerfume(Object.assign({}, p, {rating:Number(v)}))); detailSheet(id); } break; }
    case "remain":
    case "stock-toggle": {
      const p = byId(id);
      if (!p) break;
      const toggle = a === "stock-toggle";
      const remaining = toggle ? (p.remaining === "empty" ? p.remainingBeforeEmpty ?? null : "empty") : (p.remaining === v ? null : v);
      await act(() => Store.savePerfume(remainingUpdate(p,remaining)),
        toggle ? (remaining === "empty" ? "已用完，將從推薦排除" : "已恢復推薦") : "");
      if (!toggle || b.dataset.origin === "detail") detailSheet(id);
      break;
    }
    case "ffam": case "focc": case "fsea": b.setAttribute("aria-pressed", b.getAttribute("aria-pressed") !== "true"); break;
    case "fown":
      document.querySelectorAll("#f-own .chip").forEach(chip => chip.setAttribute("aria-pressed", chip === b));
      $("#f-tried-field").hidden = v !== "tried";
      break;
    case "del": {
      const p = byId(id);
      if (!p || !confirmDelete(b,"確定刪除？再點一次")) break;
      closeSheet();
      await act(() => Store.deletePerfume(id), p.own === "tried" ? "已刪除試香紀錄" : "已刪除");
      break;
    }
    case "fam":
      S.fam = v || null;
      if (!S.fam) S.famOpen = false;
      renderShelf();
      break;
    case "fam-toggle":
      S.famOpen = !(S.famOpen || S.fam);
      if (!S.famOpen) S.fam = null;
      renderShelf();
      break;
    case "stock-filter":
      S.stock = v;
      $("#v-shelf").querySelectorAll('[data-act="stock-filter"]').forEach(chip => chip.setAttribute("aria-pressed", chip === b));
      renderShelfResults();
      break;
    case "month": { const [y,m] = S.calMonth.split("-").map(Number); const d = new Date(y, m-1+Number(v), 1); S.calMonth = `${d.getFullYear()}-${pad(d.getMonth()+1)}`; render(); break; }
    case "day": daySheet(v); break;
    case "edit-day": if (S.perfumes.length) editDaySheet(v); break;
    case "export": {
      const data = JSON.stringify(Store.data);
      const io = $("#io"); io.value = data;
      try { await navigator.clipboard.writeText(data); toast("已複製，貼到記事本保存即可"); }
      catch { io.focus(); io.select(); toast("已放進下方文字框，請全選複製"); }
      break;
    }
    case "import": {
      let data; try { data = Store.normalize(JSON.parse($("#io").value)); } catch { toast("格式不正確，請貼上完整的備份資料"); break; }
      const np = Object.values(data.perfumes).filter(p => !p.del).length, nw = Object.values(data.wears).filter(w => !w.del).length;
      if (!np && !nw) { toast("備份裡沒有可匯入的資料"); break; }
      if (!importArm) { importArm = true; b.textContent = `匯入 ${np} 支香水、${nw} 筆紀錄（同一筆會覆蓋）？再點一次`; setTimeout(() => { importArm = false; if (b.isConnected) b.textContent = "匯入"; }, 5000); break; }
      importArm = false;
      // 匯入的資料視為最新
      const now = Date.now();
      Object.values(data.perfumes).forEach(p => { p.t = now; delete p.b; Store.data.perfumes[p.id] = p; });
      Object.values(data.wears).forEach(w => { w.t = now; Store.data.wears[w.id] = w; });
      if (Store.bundle) Store.mergeBundle(Store.bundle);
      Store.save(); toast("匯入完成"); break;
    }
  }
});
document.addEventListener("input", e => {
  if (e.target.id !== "shelf-q") return;
  S.q = e.target.value;
  renderShelfResults();
});
const bottleUploads = new Map();
document.addEventListener("change", async e => {
  if (e.target.id !== "photo-in" || !e.target.files || !e.target.files[0]) return;
  const id = e.target.dataset.id, p = byId(id); if (!p) return;
  const job = Symbol(id), file = e.target.files[0];
  bottleUploads.set(id,job);
  e.target.value = "";
  try {
    const objectUrl = URL.createObjectURL(file);
    let photo;
    try { photo = preparePhoto(await loadPhoto(objectUrl)); }
    finally { URL.revokeObjectURL(objectUrl); }
    const current = byId(id);
    if (bottleUploads.get(id) !== job || !current || versionKey(p) !== versionKey(current)) return;
    await Store.savePerfume({...current,photo:photo.url,photoTransparent:photo.transparent});
    if (viewingPerfume(id)) detailSheet(id);
    toast(photo.transparent ? "瓶照已去背並儲存" : "已儲存瓶照，白底圖片較適合自動去背");
  } catch { if (bottleUploads.get(id) === job) toast("這張照片讀不到，換一張試試"); }
  finally { if (bottleUploads.get(id) === job) bottleUploads.delete(id); }
});
$("#backdrop").addEventListener("click", closeSheet);
document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });

const sheet = $("#sheet");
sheet.addEventListener("touchstart", e => {
  resetSheetSwipe();
  if (e.touches.length !== 1 || e.target.closest("input, textarea, select, [contenteditable]")) return;
  // 內容尚未捲回頂端時，向下滑仍用來捲動內文；拉柄則隨時可關閉。
  if (!e.target.closest(".sheet-top") && $("#sheet-scroll").scrollTop > 0) return;
  const {clientX, clientY} = e.touches[0];
  sheetSwipe = {x:clientX, y:clientY, distance:0, closeButton:!!e.target.closest(".sheet-close")};
}, {passive:true});
sheet.addEventListener("touchmove", e => {
  if (!sheetSwipe) return;
  if (e.touches.length !== 1) { resetSheetSwipe(); return; }
  const dx = Math.abs(e.touches[0].clientX - sheetSwipe.x);
  const dy = e.touches[0].clientY - sheetSwipe.y;
  if (!sheetSwipe.distance) {
    if (Math.max(dx, Math.abs(dy)) < 6) return;
    if (dy <= dx || !e.cancelable) { resetSheetSwipe(); return; }
  }
  e.preventDefault();
  sheetSwipe.distance = Math.max(1, dy);
  sheet.style.setProperty("--sheet-offset", `${sheetSwipe.distance}px`);
}, {passive:false});
sheet.addEventListener("touchend", e => {
  // 慣性捲動時，瀏覽器可能用第一次點擊停止捲動而略過 click。
  const touch = e.changedTouches[0];
  const closeTap = sheetSwipe?.closeButton && !sheetSwipe.distance && touch &&
    Math.hypot(touch.clientX - sheetSwipe.x, touch.clientY - sheetSwipe.y) < 8;
  if (closeTap || sheetSwipe?.distance >= 76) {
    if (e.cancelable) e.preventDefault();
    closeSheet();
  } else {
    resetSheetSwipe();
  }
}, {passive:false});
sheet.addEventListener("touchcancel", resetSheetSwipe, {passive:true});

function route(){
  if (readWeatherHash()) { S.view = "today"; closeSheet(); render(); toast(`已帶入 Apple 天氣：${S.ctx.temp}°C`); try { location.replace("#today"); } catch {} return; }
  const h = location.hash.slice(1); S.view = VIEWS.includes(h) ? h : "today"; closeSheet(); render(); window.scrollTo(0,0);
}
window.addEventListener("hashchange", route);

let toastT;
function toast(msg){ const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2400); }
function showStatus(msg){ const s = $("#status"); s.textContent = msg; s.hidden = false; }
function hideStatus(){ $("#status").hidden = true; }

/* ---------- 版本：GitHub Actions 發布時把 __APP_VERSION__ 換成「月/日 時:分 · commit」 ---------- */
const APP_VERSION = "__APP_VERSION__";
const isDevBuild = APP_VERSION.startsWith("__");
$("#app-version").textContent = "版本 " + (isDevBuild ? "開發中" : APP_VERSION);
// 網頁會被手機快取最多 10 分鐘；打開或切回 App 時問一下伺服器，有新版就帶著新版號重新載入
async function checkUpdate(){
  if (isDevBuild) return;
  try {
    const latest = (await fetch("version.json?t=" + Date.now(), {cache:"no-store"}).then(r => r.json())).version;
    if (!latest || latest === APP_VERSION) return;
    if (sessionStorage.getItem("update-tried") === latest) { showStatus(`新版本 ${latest} 還在發布中，過幾分鐘再打開一次。`); return; }
    if (!$("#sheet").hidden) return; // 面板開著時先不打斷，下次切回 App 再更新
    sessionStorage.setItem("update-tried", latest);
    location.replace(location.pathname + "?v=" + encodeURIComponent(latest) + location.hash);
  } catch {}
}

S.weather = lsGet("wx"); applyWeather();
checkUpdate();
route();
Store.init().then(() => Weather.load());
Sync.init();
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState !== "visible") return;
  if (ymd(new Date()) !== TODAY) { location.reload(); return; } // 隔天回到 App 就重新整理
  checkUpdate();
  Weather.load();
  if (Sync.valid() && Sync.dirty) Sync.run();
});
})();
</script>
