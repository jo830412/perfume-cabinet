<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>我的香水櫃</title>
<meta name="theme-color" content="#ECEEF3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10121A" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="香水櫃">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=IBM+Plex+Mono:wght@500&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: one-column phone app — context strip, hero pick, shelf grid mirroring the physical 5×4 cabinet, fixed tab bar */
:root{
  --bg:#ECEEF3; --surface:#FFFFFF; --surface-2:#E1E4EC; --ink:#161925; --muted:#5B6174; --line:#D0D4DF;
  --accent:#2C4677; --accent-ink:#FFFFFF; --accent-soft:#DCE3F2; --amber:#9A5B14; --danger:#A23A3A;
  --f-citrus:#C9A227; --f-aquatic:#3B8EB5; --f-green:#5E8C4A; --f-woody:#8A6A4A; --f-vetiver:#6B7A3A;
  --f-leather:#6E4630; --f-smoky:#6F6F78; --f-amber:#B9742A; --f-floral:#C2667E; --f-powdery:#9C88B8;
  --f-oud:#7A4766; --f-tea:#8C8A4E; --f-fruity:#C2533F; --f-spicy:#A65A2E;
  --font-display:"Marcellus","Noto Sans TC","PingFang TC","Microsoft JhengHei",serif;
  --font-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --font-data:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
  --r:14px; --nav-h:64px;
  /* 木頭層架 */
  --cabinet-back:#E9E1D6; --cabinet-frame:#8B5E3C; --wood:#A8744A; --wood-hi:#C99A6B; --wood-lo:#7A4F2E; --shelf-shadow:rgba(60,35,15,.35);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10121A; --surface:#1A1D28; --surface-2:#252937; --ink:#E8EAF2; --muted:#9AA0B5; --line:#2F3446;
  --accent:#93ABE2; --accent-ink:#0E1322; --accent-soft:#25304A; --amber:#E2A65C; --danger:#E07C7C; color-scheme:dark;
  --cabinet-back:#241E1A; --cabinet-frame:#5A3B24; --wood:#7E5534; --wood-hi:#A1764F; --wood-lo:#553620; --shelf-shadow:rgba(0,0,0,.55)}}
:root[data-theme="dark"]{
  --bg:#10121A; --surface:#1A1D28; --surface-2:#252937; --ink:#E8EAF2; --muted:#9AA0B5; --line:#2F3446;
  --accent:#93ABE2; --accent-ink:#0E1322; --accent-soft:#25304A; --amber:#E2A65C; --danger:#E07C7C; color-scheme:dark;
  --cabinet-back:#241E1A; --cabinet-frame:#5A3B24; --wood:#7E5534; --wood-hi:#A1764F; --wood-lo:#553620; --shelf-shadow:rgba(0,0,0,.55)}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.55;-webkit-tap-highlight-color:transparent}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 24px)}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-block:6px 14px}
.top h1{font-size:20px;margin:0;font-weight:700;letter-spacing:.02em}
.top .date{font-family:var(--font-data);font-size:13px;color:var(--muted)}
.view{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
h2{font-size:13px;font-weight:500;color:var(--muted);letter-spacing:.08em;margin:6px 0 0}
.card{background:var(--surface);border-radius:var(--r);padding:16px}
.muted{color:var(--muted)}
.small{font-size:13px}
.mono{font-family:var(--font-data);font-variant-numeric:tabular-nums}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:7px 13px;font-size:14px;min-height:36px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.fam{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:2px 9px 2px 7px;border-radius:999px;background:var(--surface-2);color:var(--ink)}
.fam i{width:8px;height:8px;border-radius:50%;background:var(--c);display:inline-block}

/* context */
.disclosure{background:var(--surface);border-radius:12px;min-width:0}
.disclosure>summary{min-height:44px;padding:10px 12px;display:flex;align-items:center;gap:8px;cursor:pointer;list-style:none}
.disclosure>summary::-webkit-details-marker{display:none}
.disclosure>summary::after{content:"";width:7px;height:7px;border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);transform:rotate(45deg);margin:0 3px 4px auto;flex:none}
.disclosure[open]>summary::after{transform:rotate(225deg);margin-bottom:-4px}
.weather-summary .location{font-size:13px;min-width:0;text-overflow:ellipsis;overflow:hidden;white-space:nowrap}
.weather-summary output{font-size:17px;font-weight:500;white-space:nowrap}
.weather-summary .weather-risk{font-size:12px;color:var(--muted);white-space:nowrap}
.weather-info{display:grid;gap:10px;padding:10px 12px 12px;border-top:1px solid var(--line)}
.weather-info .chip{justify-self:start;min-height:44px}
/* 場合：一排可以左右滑的小按鈕 */
.occasions{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding:2px 16px;scroll-padding-inline:16px}
.occasions::-webkit-scrollbar{display:none}
.occasions .chip{flex:none;min-height:38px;padding:6px 14px;font-size:14px;white-space:nowrap}
.wx-brief{font-size:13px;color:var(--ink);white-space:nowrap}
.weather-summary .location{color:var(--muted)}
.wx-foot{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--muted)}
.wx-foot span{flex:1;min-width:0}
.icon-btn{flex:none;display:grid;place-items:center;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:transparent;font-size:18px;line-height:1;color:var(--ink)}
.icon-btn.spinning{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.wx-periods .past{opacity:.5;padding-block:8px}
.wx-periods .past .small{color:var(--muted)}
.label{font-size:12px;color:var(--muted);letter-spacing:.06em}

/* pick */
.pick{position:relative;overflow:hidden;padding:20px 18px 18px}
.pick::before{content:"";position:absolute;inset:0 0 auto 0;height:5px;background:var(--c,var(--accent))}
.pick .eyebrow{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted);letter-spacing:.08em}
.pick .brand{font-size:13px;color:var(--muted);margin-top:10px}
.pick .pname{font-family:var(--font-display);font-size:30px;line-height:1.15;margin:2px 0 10px;text-wrap:balance;overflow-wrap:anywhere}
.why{list-style:none;padding:0;margin:12px 0 0;display:grid;gap:6px}
.why li{padding-left:18px;position:relative}
.why li::before{content:"";position:absolute;left:3px;top:.62em;width:7px;height:7px;border-radius:2px;background:var(--c,var(--accent));transform:rotate(45deg)}
.tips{margin-top:10px;font-size:13px;color:var(--amber)}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.facts div{min-width:0}
.facts b{display:block;font-family:var(--font-data);font-weight:500;font-size:15px}
.meter{display:flex;gap:3px;margin-top:4px}
.meter span{width:14px;height:8px;border-radius:3px;background:var(--surface-2)}
.metric-val{display:flex;align-items:baseline;gap:3px;margin-top:2px;font-size:12px;color:var(--muted);white-space:nowrap}
.metric-val b{font-size:16px;font-weight:500;color:var(--ink)}
.meter span.on{background:var(--ink)}
.meter span.half{background:linear-gradient(90deg,var(--ink) 50%,var(--surface-2) 50%)}
.actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.today-actions{gap:8px}
.today-actions .btn{padding-inline:10px;white-space:nowrap}
.btn{border:0;border-radius:12px;padding:12px 16px;min-height:46px;font-weight:500;background:var(--surface-2)}
.btn.primary{background:var(--accent);color:var(--accent-ink);flex:1}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.danger{color:var(--danger)}
.btn.wide{width:100%}
.done-badge{display:inline-flex;align-items:center;gap:6px;color:var(--accent);font-weight:500}

/* alt list */
.alts{display:grid;gap:10px}
.alt{display:grid;grid-template-columns:6px auto minmax(0,1fr);gap:12px;align-items:center;background:var(--surface);border-radius:var(--r);padding:12px 12px 12px 0;border:0;text-align:left;width:100%}
.alt .bar{align-self:stretch;border-radius:0 4px 4px 0;background:var(--c)}
.alt .n{font-family:var(--font-display);font-size:18px;line-height:1.2;overflow-wrap:anywhere}
.alt .s{font-size:12px;color:var(--muted)}

/* shelf */
.toolbar{display:flex;gap:8px;align-items:center}
.search{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;min-height:44px}
.famscroll{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.famscroll .chip{white-space:nowrap;flex:none;min-height:44px}
.shelf-toolbar .btn{flex:none;padding-inline:12px;min-height:44px}
.fam-toggle[aria-expanded="true"]{border-color:var(--accent);color:var(--accent)}
/* 分段按鈕：一排放得下，每段下面是數量 */
.seg{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:2px;padding:3px;border-radius:12px;background:var(--surface-2)}
.seg button{display:grid;justify-items:center;gap:0;min-height:44px;padding:4px 2px;border:0;border-radius:9px;background:transparent;color:var(--muted);font-size:13px;line-height:1.25}
.seg button b{font-family:var(--font-data);font-size:11px;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:500;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.alt:active{background:var(--surface-2)}

/* log */
.cal-head{display:flex;justify-content:space-between;align-items:center}
.cal-head button{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:transparent}
.cal-head b{font-family:var(--font-data);font-weight:500}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-top:10px}
.cal .dow{font-size:11px;text-align:center;color:var(--muted);padding-bottom:4px}
.day{border:0;background:transparent;border-radius:8px;min-height:54px;padding:4px 2px;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
.day .dn{font-family:var(--font-data);font-size:12px;color:var(--muted)}
.day .dot{width:22px;height:22px;border-radius:50%;background:var(--c);display:grid;place-items:center;font-size:10px;color:#fff;font-weight:700;font-family:var(--font-data)}
.day.is-today .dn{color:var(--accent);font-weight:700}
.day.blank{visibility:hidden}
.day.future{opacity:.35}
.stats{display:grid;gap:10px}
.rank{display:grid;gap:6px;margin:6px 0 0;padding:0;list-style:none}
.rank li{display:flex;justify-content:space-between;gap:10px}
.rank li span:first-child{min-width:0;overflow-wrap:anywhere}

/* sheet */
.backdrop{position:fixed;inset:0;background:rgba(10,12,20,.45);z-index:40}
body.sheet-open{position:fixed;left:0;right:0;width:100%;overflow:hidden}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--surface);border-radius:18px 18px 0 0;max-height:88vh;max-height:88dvh;display:flex;flex-direction:column;overflow:hidden;transform:translateY(var(--sheet-offset,0px))}
.sheet-scroll{min-height:0;overflow:auto;overscroll-behavior-y:contain;padding:0 max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet-inner{max-width:560px;margin:0 auto;display:grid;gap:12px}
.sheet-close{justify-self:end;display:grid;place-items:center;min-width:44px;min-height:44px;border:0;border-radius:50%;background:var(--surface-2);font-size:23px;line-height:1}
.sheet-top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;flex:none;width:100%;max-width:592px;margin:0 auto;padding:10px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));touch-action:none}
.sheet-top .grip{grid-column:2;margin:0}
.detail-controls{display:grid;gap:10px}
.detail-controls .actions{margin-top:0}
.detail-controls .chip{min-height:44px}
.stock-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.stock-action{min-height:44px;padding-inline:12px}
.catalog-results{display:grid;gap:5px}
.catalog-choice{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:44px;width:100%;border:1px solid var(--line);border-radius:10px;background:var(--bg);text-align:left;padding:8px 10px}
.catalog-choice span{min-width:0;overflow-wrap:anywhere}
.detail-profile{background:var(--bg)}
.charts{display:grid;gap:14px;padding:14px 12px;border-radius:12px;background:var(--bg)}
.charts .facts{padding-top:12px}
.profile-body{display:grid;gap:14px;padding:0 12px 12px}
.community-score{display:inline-flex;gap:6px;align-items:baseline;color:var(--muted);font-size:12px}
.community-score strong{font-size:14px;color:var(--ink);font-variant-numeric:tabular-nums}
.detail-score{margin-top:6px}
.note-list{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 12px;margin:0;padding:12px;background:var(--bg);border-radius:12px;font-size:14px}
.note-list dt{color:var(--muted);white-space:nowrap}
.note-list dd{margin:0;overflow-wrap:anywhere;white-space:pre-line}
.perfume-form,.form-section{display:grid;gap:12px}
.perfume-form :is(input,select,textarea){font-size:16px}
.form-options{background:var(--bg)}
.form-section{padding:0 12px 12px}
.form-actions{margin-top:0;position:sticky;bottom:0;z-index:1;padding:6px 0;background:var(--surface)}
.duplicate-notice{display:grid;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px}
.duplicate-notice .actions{margin:0;gap:8px}
.duplicate-notice .btn{min-height:44px;padding:8px 10px}
.version-status{margin:0;padding:10px 12px;border-radius:10px;background:var(--bg);font-size:13px;color:var(--muted)}
.lookup-link{color:var(--accent);text-underline-offset:3px;font-size:14px;width:fit-content;min-height:44px;display:flex;align-items:center}
.photo-controls .chip{display:inline-flex;align-items:center;min-height:44px}
.grip{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 4px}
.sheet h3{font-family:var(--font-display);font-weight:400;font-size:26px;line-height:1.15;margin:0;overflow-wrap:anywhere}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;overflow-wrap:anywhere}
.stars{display:flex;gap:2px}
.stars button{min-width:42px;min-height:44px;border:0;background:transparent;font-size:26px;line-height:1;padding:4px;color:var(--line)}
.stars button.on{color:var(--amber)}
.field{display:grid;gap:6px}
.field label,.field .label{font-size:13px;color:var(--muted)}
.field input,.field textarea,.field select{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;min-height:44px;width:100%}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.pickrow{display:flex;align-items:center;gap:10px;width:100%;border:0;background:var(--bg);border-radius:10px;padding:10px 12px;text-align:left;min-height:46px}
.pickrow i{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.pickrow[aria-pressed="true"]{background:var(--accent-soft);font-weight:500}
.wear-summary{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px;border-radius:12px;background:var(--bg);overflow-wrap:anywhere}
.day-options,.day-footer{display:grid;gap:6px}
.day-footer .actions{margin-top:0}
.day-footer button:disabled{opacity:.55;cursor:default}
.wear-option-name{flex:1;min-width:0;overflow-wrap:anywhere}
textarea.io{min-height:140px;font-family:var(--font-data);font-size:12px}
.accbars{display:grid;gap:5px;margin-top:8px}
.ab{display:grid;grid-template-columns:4.6em minmax(0,1fr);gap:10px;align-items:center;font-size:13px}
.at{height:10px;border-radius:5px;background:var(--surface-2);overflow:hidden}
.at i{display:block;height:100%;border-radius:5px}
.seabars{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;margin-top:8px;font-size:12px;text-align:center;color:var(--muted)}
.sb{display:grid;gap:4px;justify-items:center}
.st{width:18px;height:52px;border-radius:5px;background:var(--surface-2);display:flex;align-items:flex-end;overflow:hidden}
.st i{display:block;width:100%;background:var(--accent);border-radius:5px}
.kv a{color:var(--accent)}
.wx-periods{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.wx-periods div{background:var(--surface-2);border-radius:10px;padding:8px 4px;display:grid;justify-items:center;gap:2px}
.wx-periods b{font-weight:500;font-size:18px}
.wx-periods .past{opacity:.45}
/* 香水圖片：白底相片框（瓶身照本身是白底），兩種主題都用白色 */
.ph{display:block;border-radius:10px;overflow:hidden;flex:none}
.ph img{display:block;width:100%;height:100%;object-fit:contain}
.ph img[data-masked]{-webkit-mask:var(--bottle-mask) center / contain no-repeat;mask:var(--bottle-mask) center / contain no-repeat}
.ph:empty{background:var(--surface-2)}
.ph-lg{width:90px;height:120px}
.ph-sm{width:42px;height:56px;border-radius:8px}
.ph-card{width:72px;height:96px}
.pick-top{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:start}
.alt{grid-template-columns:6px auto minmax(0,1fr) auto}

/* nav */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.tabbar .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);height:var(--nav-h)}
.tabbar a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);text-decoration:none;font-size:11px}
.tabbar a[aria-current="page"]{color:var(--accent);font-weight:500}
.tabbar svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
/* 提示訊息從上方出現，不會擋到下方按鈕 */
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 12px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;z-index:60;max-width:calc(100% - 32px);box-shadow:0 6px 18px rgba(0,0,0,.18)}
.banner{background:var(--accent-soft);border-radius:12px;padding:10px 14px;font-size:13px}
.empty-state{text-align:center;padding:28px 16px}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
html,body{margin:0}
.wrap{padding-top:calc(14px + env(safe-area-inset-top,0px))}
.top-r{display:flex;align-items:center;gap:8px}
.sync-chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 10px;font-size:12px;min-height:30px;color:var(--muted)}
.sync-chip[data-state="need"]{border-color:var(--accent);color:var(--accent);font-weight:500}
.app-version{margin:-10px 0 10px;font-family:var(--font-data);font-size:11px;color:var(--muted);letter-spacing:.02em}

/* 香水櫃：木頭層架，一排 3～4 罐 */
.cabinet{background:var(--cabinet-back);border:8px solid var(--cabinet-frame);border-radius:14px;padding:4px 0 6px;
  box-shadow:inset 0 10px 18px -10px var(--shelf-shadow), 0 2px 6px var(--shelf-shadow)}
.shelf-row{padding:14px 0 10px}
.shelf-bottles,.shelf-labels{display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));gap:0 8px;padding:0 10px}
.shelf-bottles{align-items:end}
.bottle{position:relative;display:flex;justify-content:center;align-items:flex-end;min-width:0;height:118px;padding:0;border:0;background:transparent}
.bottle .ph{background:transparent}
.bottle .ph img{object-position:center bottom;filter:drop-shadow(0 4px 3px var(--shelf-shadow))}
.bottle.is-empty{opacity:.45}
.today-tag{position:absolute;top:0;right:2px;z-index:1;font-size:10px;font-weight:700;padding:1px 6px;border-radius:999px;background:var(--accent);color:var(--accent-ink)}
.ph-shelf{width:100%;max-width:84px;height:112px}
.plank{height:14px;margin:0 -2px;border-radius:2px;
  background:repeating-linear-gradient(92deg,transparent 0 23px,rgba(0,0,0,.07) 23px 25px,transparent 25px 61px,rgba(255,255,255,.06) 61px 62px),
    linear-gradient(180deg,var(--wood-hi) 0 3px,var(--wood) 3px 10px,var(--wood-lo) 10px);
  box-shadow:0 7px 9px -4px var(--shelf-shadow)}
.shelf-labels{margin-top:8px;align-items:start}
.bottle-label{display:grid;gap:2px;min-width:0;padding:0;border:0;background:transparent;text-align:center;justify-items:center}
.bottle-label .n{font-family:var(--font-display);font-size:13px;line-height:1.2;color:var(--ink);overflow-wrap:anywhere;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bottle-label .s{font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.bottle-label .recent{font-size:10.5px;color:var(--muted)}
.mini-score{color:var(--amber);font-weight:500;font-variant-numeric:tabular-nums}

/* 今天的多筆紀錄 */
.wear-timeline{list-style:none;margin:12px 0 0;padding:10px 12px;display:grid;gap:4px;background:var(--bg);border-radius:10px;font-size:13px}
.wear-timeline li{display:flex;gap:10px;align-items:baseline}
.wear-timeline li .mono{color:var(--muted);min-width:3.2em}
.refill{font-size:11px;padding:0 7px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.day-entries{display:grid;gap:8px}
.entry-actions{display:flex;gap:6px;flex:none}
.entry-actions .chip{min-height:40px;padding:6px 10px}
.danger-chip{color:var(--danger)}

/* 日曆瓶身小圖 */
.cal-bottle{position:relative;display:block}
.ph-cal{width:24px;height:32px;border-radius:4px}
.cal-more{position:absolute;right:-9px;bottom:-3px;font-size:9px;font-weight:700;padding:0 3px;border-radius:6px;background:var(--accent);color:var(--accent-ink);font-family:var(--font-data)}
.day{min-height:62px}

/* 新增香水：網址預覽、類型 */
.src-row{display:flex;gap:8px;align-items:center}
.src-row input{flex:1}
.missing-details{display:grid;gap:8px;padding:12px;border-radius:12px;border:1px dashed var(--line)}
.missing-details .chip{justify-self:start;min-height:40px}
.own-tag{justify-self:start;font-size:12px;font-weight:500;padding:3px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.similar{display:flex;gap:10px;align-items:center;width:100%;padding:10px 12px;border:0;border-radius:12px;background:var(--bg);text-align:left}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <h1>我的香水櫃</h1>
    <span class="top-r"><button class="sync-chip" id="sync-chip" data-act="sync" hidden></button><span class="date" id="hdr-date"></span></span>
  </header>
  <div class="app-version" id="app-version"></div>
  <div class="banner" id="status" hidden></div>

  <section class="view" id="v-today" aria-label="今日推薦"></section>
  <section class="view" id="v-shelf" aria-label="香水櫃" hidden></section>
  <section class="view" id="v-log" aria-label="使用紀錄" hidden></section>
  <section class="view" id="v-prefs" aria-label="設定" hidden></section>
</div>

<nav class="tabbar" aria-label="主選單"><div class="in">
  <a href="#today" data-tab="today"><svg viewBox="0 0 24 24"><path d="M9 3h6v3H9z"/><path d="M8 6h8l1 3v10a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2V9z"/><path d="M10 13h4"/></svg>今日</a>
  <a href="#shelf" data-tab="shelf"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18M15 3v18"/></svg>香水櫃</a>
  <a href="#log" data-tab="log"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>紀錄</a>
  <a href="#prefs" data-tab="prefs"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>設定</a>
</div></nav>

<div class="backdrop" id="backdrop" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="香水櫃面板" hidden>
  <div class="sheet-top"><div class="grip" aria-hidden="true"></div><button class="sheet-close" data-act="close" aria-label="關閉">×</button></div>
  <div class="sheet-scroll" id="sheet-scroll"><div class="sheet-inner" id="sheet-body"></div></div>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
(() => {
"use strict";
// Fragrantica 主要香調（accord）→ 名稱與色票
const ACC = {woody:["木質","#8A6A4A"],citrus:["柑橘","#D4B21F"],aromatic:["芳香","#3E9C84"],amber:["琥珀","#BC5A14"],musky:["麝香","#B5A3C4"],
  freshspicy:["清新辛香","#7DAE36"],softspicy:["柔和辛香","#D9805F"],warmspicy:["溫暖辛香","#C0391B"],oud:["沉香","#5E4636"],earthy:["泥土","#6B5D45"],
  powdery:["粉感","#B29BC9"],balsamic:["香脂","#9A6B4F"],green:["綠意","#3F9A3A"],fresh:["清新","#5FB4CF"],herbal:["草本","#6E9152"],fruity:["果香","#D2493A"],
  leather:["皮革","#6E4630"],smoky:["煙燻","#757580"],sweet:["甜香","#D8608A"],rose:["玫瑰","#D23C6A"],animalic:["動物","#80603F"],metallic:["金屬","#8C96A3"],
  floral:["花香","#E07BAA"],yellowfloral:["黃色花","#E0B526"],whitefloral:["白花","#C8BFA6"],vanilla:["香草","#D1A876"],lavender:["薰衣草","#8E7CC3"],
  mineral:["礦物","#7C8B93"],aquatic:["水感","#3B8EB5"],mossy:["苔蘚","#5F6E3A"],
  vetiver:["岩蘭草","#6B7A3A"],tea:["茶香","#8C8A4E"],spicy:["辛香","#A65A2E"]};
const LEGACY = ["vetiver","tea","spicy"];
const FAM = Object.fromEntries(Object.entries(ACC).map(([k,v]) => [k, v[0]]));
const FAM_EDIT = Object.fromEntries(Object.entries(FAM).filter(([k]) => !LEGACY.includes(k)));
const accName = k => (ACC[k] || [k])[0];
const accColor = k => (ACC[k] || [0,"#8A8F9C"])[1];
const OCC = {office:"上班",casual:"休閒",date:"約會",formal:"正式",sport:"運動戶外",night:"夜晚聚會"};
const REMAIN = {full:"滿",most:"多",half:"半",low:"少"};
const SEASON = {spring:"春",summer:"夏",fall:"秋",winter:"冬",day:"白天",night:"晚上"};
const SEASON_CENTER = {winter:13, spring:21, fall:24, summer:30}; // 各季節代表氣溫 °C
const NEUTRAL_SUITABILITY = 70;
const isNightOcc = occ => occ === "date" || occ === "night";
const FRESH = ["citrus","aquatic","green","fresh","freshspicy","aromatic","herbal","tea","mineral"];
const HEAVY = ["amber","oud","leather","smoky","sweet","vanilla","balsamic","animalic","warmspicy"];
const AVG_HIGH = [19,20,22,26,29,32,34,33,31,28,25,21]; // 台北各月平均高溫
const WEEK = "日一二三四五六";
const VIEWS = ["today","shelf","log","prefs"];
const STOCK_SEG = {active:"現有",empty:"用完",all:"全部",wish:"想買",tried:"試香"};
// own：沒有值 = 我有的；"wish" = 想買；"tried" = 試香過（後兩種不進推薦和使用紀錄）
const OWN_TYPES = {"":"我有的",wish:"想買",tried:"試香過"};
const isOwned = p => !p.own;
const LKEY = "perfume-cabinet-v1";

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num = (v, d) => (typeof v === "number" && isFinite(v)) ? v : d;
const pad = n => String(n).padStart(2,"0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const daysBetween = (a,b) => Math.round((Date.parse(b+"T00:00:00Z") - Date.parse(a+"T00:00:00Z"))/864e5);
const famColor = p => accColor((p && p.families && p.families[0]) || "woody");
const lsGet = k => { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } };
const lsSet = (k,v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
function jitter(str){ let h = 2166136261; for (const c of str) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return ((h >>> 0) / 4294967295) - .5; }

const TODAY = ymd(new Date());
const S = {
  mode:"loading", perfumes:[], wearList:[],
  view:"today", q:"", fam:null, stock:"active", offset:0,
  calMonth: TODAY.slice(0,7), ctx:null
};

/* ---------- today context (per-device convenience) ---------- */
function defaultCtx(){
  const d = new Date(); const wk = d.getDay();
  return { temp: AVG_HIGH[d.getMonth()], wet:false, occ: (wk===0||wk===6) ? "casual" : "office", guessed:true };
}
S.ctx = Object.assign(defaultCtx(), lsGet("ctx-"+TODAY) || {});
const saveCtx = () => lsSet("ctx-"+TODAY, S.ctx);

/* iPhone 捷徑帶進來的天氣：#wx-25-h80-r60（m 開頭代表零下，例如 wx-m3） */
function readWeatherHash(){
  const m = location.hash.slice(1).match(/^wx-(m|-)?(\d{1,2})(?:-h(\d{1,3}))?(?:-r(\d{1,3}))?/i);
  if (!m) return false;
  const temp = parseInt(m[2],10) * (m[1] ? -1 : 1);
  const hum = m[3] != null ? Math.min(100, parseInt(m[3],10)) : null;
  const rain = m[4] != null ? Math.min(100, parseInt(m[4],10)) : null;
  const d = new Date();
  S.ctx = Object.assign({}, S.ctx, {temp, hum, rain, wet: (rain != null && rain >= 50) || (hum != null && hum >= 90),
    guessed:false, src:"apple", at:`${pad(d.getHours())}:${pad(d.getMinutes())}`});
  saveCtx(); S.offset = 0;
  return true;
}

const todayWeather = () => (S.weather && S.weather.date === TODAY) ? S.weather : null;
function weatherForOcc(w,occ){
  const prefix = isNightOcc(occ) ? "night" : "day";
  const temp = w[prefix+"Feels"];
  const label = prefix === "night" ? "晚上體感溫度" : "白天體感溫度";
  // 讓上一版的快取可用到下一次天氣更新。
  if (!Number.isFinite(w.currentFeels)) return {temp, rain:w.rainProb, humidity:w.humidity, label};
  return Number.isFinite(temp)
    ? {temp, rain:w[prefix+"RainProb"], humidity:w[prefix+"Humidity"], label}
    : {temp:w.currentFeels, rain:w.currentRainProb, humidity:w.currentHumidity, label:"目前體感溫度"};
}
function applyWeather(){
  const w = todayWeather();
  if (!w) return;
  const {temp,rain,humidity} = weatherForOcc(w,S.ctx.occ);
  S.ctx = Object.assign({}, S.ctx, {temp: Math.round(num(temp, S.ctx.temp)),
    wet: num(rain,0) >= 50 || num(humidity,0) >= 90, guessed:false, src:"auto"});
}

/* ---------- 資料：存在手機（localStorage），可同步到 Google 雲端硬碟 ---------- */
// Google Cloud Console →「API 和服務」→「憑證」→ OAuth 用戶端 ID（網頁應用程式）。這個 ID 是公開的，不是密碼。
const GOOGLE_CLIENT_ID = "288072368244-huo1rnfas2s4rovnab1cs91hc6n6e3lt.apps.googleusercontent.com";
const USER_FIELDS = ["rating","remaining","remainingBeforeEmpty","memo","row","col","occ","photo","fragranticaRating","own","triedOn"];
// Fragrantica 完整資料（網站 perfumes.json 的 details，以 Fragrantica 網址 ID 對應）會補進這些欄位
const DETAIL_FIELDS = ["accords","families","seasons","strength","longevity","votes","notes"];
const Store = {
  bundle: null,
  data: {perfumes:{}, wears:{}},
  async init(){
    const saved = lsGet(LKEY);
    if (saved) this.data = this.normalize(saved);
    try {
      const b = await fetch("perfumes.json", {cache:"no-cache"}).then(r => { if (!r.ok) throw 0; return r.json(); });
      this.mergeBundle(b);
    } catch { if (!Object.keys(this.data.perfumes).length) showStatus("讀不到香水資料，請確認網路後重新打開。"); }
    S.mode = "local";
    this.save(false);
  },
  // 也接受舊版備份格式（perfumes 是陣列、wears 是陣列或物件）
  normalize(x){
    const d = {perfumes:{}, wears:{}};
    const ps = Array.isArray(x.perfumes) ? x.perfumes : Object.values(x.perfumes || {});
    ps.forEach(p => { if (p && p.id) d.perfumes[p.id] = Object.assign({t:0}, p); });
    // 使用紀錄一天可以有多筆；舊資料一天一筆、以日期當代號，照樣沿用
    const ws = Array.isArray(x.wears) ? x.wears : Object.entries(x.wears || {}).map(([key,w]) => Object.assign({id:key}, w));
    ws.forEach(w => { if (w && w.date) { const id = w.id || w.date; d.wears[id] = Object.assign({t:0}, w, {id}); } });
    return d;
  },
  // 網站 details 有這支香水的完整資料、而且是新的一版（請 Claude 補資料時才會更新），就補進去
  applyDetails(b){
    const details = b?.details || {};
    for (const p of Object.values(this.data.perfumes)) {
      const fid = !p.del && fragranticaId(p.source), det = fid && details[fid];
      if (!det || p.detailsVer === det.ver) continue;
      for (const key of DETAIL_FIELDS) if (det[key] != null) p[key] = det[key];
      if (Number.isFinite(det.rating)) p.fragranticaRating = det.rating;
      p.detailsVer = det.ver;
      p.t = Date.now();
    }
  },
  // 更新網站附的香水資料並保留個人欄位；跳過已刪除的香水和無須更正的自訂資料。
  mergeBundle(b){
    this.bundle = b;
    const ver = String(b.version || "1");
    for (const p of (b.perfumes || [])) {
      const cur = this.data.perfumes[p.id];
      // 只替換已知的錯誤版本，包含從舊備份帶回來的資料。
      const old = cur && !cur.customVersion && [].concat(b.replaces?.[p.id] || []).find(previous =>
        (previous.source && cur.source === previous.source) ||
        (!cur.source && cur.name === previous.name && cur.conc === previous.conc));
      if (cur && (cur.del || (!old && (!cur.b || cur.b === ver)))) continue;
      const keep = cur ? Object.fromEntries(USER_FIELDS.filter(k => k in cur).map(k => [k, cur[k]])) : {};
      if (old?.memo && keep.memo === old.memo) delete keep.memo;
      if (old?.occ?.length === 0 && keep.occ?.length === 0) delete keep.occ;
      if (old) delete keep.fragranticaRating;
      this.data.perfumes[p.id] = Object.assign({}, p, keep, {b:ver, t: cur ? cur.t : 0});
      if (cur && !cur.b) delete this.data.perfumes[p.id].b;
    }
    this.applyDetails(b);
  },
  // 每筆資料各自比修改時間，新的贏
  merge(remote){
    const r = this.normalize(remote || {}); let changed = false;
    for (const col of ["perfumes","wears"]) for (const [k, v] of Object.entries(r[col])) {
      const cur = this.data[col][k];
      if (!cur || num(v.t,0) > num(cur.t,0)) { this.data[col][k] = v; changed = true; }
    }
    if (changed && this.bundle) this.mergeBundle(this.bundle);
    return changed;
  },
  save(sync = true){
    lsSet(LKEY, this.data);
    const D = this.data;
    S.perfumes = Object.values(D.perfumes).filter(p => !p.del);
    S.wearList = Object.values(D.wears).filter(w => !w.del && w.perfumeId)
      .sort((a,b) => (a.date + (a.time || "")).localeCompare(b.date + (b.time || "")) || num(a.t,0) - num(b.t,0));
    render();
    if (sync) Sync.schedule();
  },
  async savePerfume(p, edited){ const r = Object.assign({}, p, {t:Date.now()}); if (edited) delete r.b; this.data.perfumes[p.id] = r; this.save(); },
  async deletePerfume(id){ this.data.perfumes[id] = {id, del:true, t:Date.now()}; this.save(); },
  async addWear(w){ const id = `${w.date}-${Date.now().toString(36)}`; this.data.wears[id] = Object.assign({}, w, {id, t:Date.now()}); this.save(); return id; },
  async updateWear(id, patch){ const cur = this.data.wears[id]; if (!cur) return; this.data.wears[id] = Object.assign({}, cur, patch, {id, t:Date.now()}); this.save(); },
  async deleteWear(id){ const cur = this.data.wears[id]; this.data.wears[id] = {id, date:cur?.date, del:true, t:Date.now()}; this.save(); }
};
const wearsOn = date => S.wearList.filter(w => w.date === date);
const nowTime = () => { const d = new Date(); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };

/* ---------- 天氣：用手機定位找最近的鄉鎮市區，抓中央氣象署的逐時預報 ---------- */
// 中央氣象署開放資料平臺的會員授權碼（免費，公開在網頁上沒有費用風險）
const CWA_KEY = "CWA-63299957-C385-46AD-9EFC-3304B27BAC5E";
const FALLBACK_PLACE = {county:"新北市", town:"淡水區"}; // 抓不到定位時用
let TOWNS = null;
async function loadTowns(){
  if (!TOWNS) TOWNS = await fetch("towns.json").then(r => { if (!r.ok) throw 0; return r.json(); });
  return TOWNS;
}
function getPosition(){
  return new Promise(res => {
    if (!navigator.geolocation) return res(null);
    navigator.geolocation.getCurrentPosition(p => res({lat:p.coords.latitude, lon:p.coords.longitude}), () => res(null),
      {enableHighAccuracy:false, timeout:10000, maximumAge:10*60e3});
  });
}
function nearestTown(towns, pos){
  const k = Math.cos(pos.lat * Math.PI / 180);
  let best = null, bd = Infinity;
  for (const [county, town, lat, lon] of towns) {
    const d = (lat - pos.lat) ** 2 + ((lon - pos.lon) * k) ** 2;
    if (d < bd) { bd = d; best = {county, town}; }
  }
  return best;
}
function buildWeather(loc, place){
  const el = name => loc.WeatherElement.find(e => e.ElementName === name)?.Time || [];
  const read = (point, min, max) => {
    const raw = Object.values(point?.ElementValue?.[0] || {})[0];
    if (raw == null || String(raw).trim() === "") return null;
    const value = Number(raw);
    return Number.isFinite(value) && value >= min && value <= max ? value : null;
  };
  const avg = values => {
    const valid = values.filter(Number.isFinite);
    return valid.length ? valid.reduce((a,b) => a + b,0) / valid.length : null;
  };
  const feelsByTime = new Map(el("體感溫度").map(x => [x.DataTime,read(x,-60,65)]));
  const humidityByTime = new Map(el("相對濕度").map(x => [x.DataTime,read(x,0,100)]));
  const rows = el("溫度").filter(x => x.DataTime?.startsWith(TODAY+"T")).flatMap(x => {
    const at = Date.parse(x.DataTime), temp = read(x,-60,65);
    return Number.isFinite(at) && temp !== null
      ? [{at, temp, feels:feelsByTime.get(x.DataTime) ?? temp, humidity:humidityByTime.get(x.DataTime)}]
      : [];
  });
  if (!rows.length) throw new Error("No temperatures in today's forecast");
  const rain = el("3小時降雨機率").map(x => ({
    start:Date.parse(x.StartTime), end:Date.parse(x.EndTime), value:read(x,0,100)
  })).filter(x => Number.isFinite(x.value));
  const midnight = Date.parse(TODAY+"T00:00:00+08:00");
  const hour = 3600000;
  function rainBetween(start,end){
    const values = rain.filter(r => r.start < end && r.end > start).map(r => r.value);
    return values.length ? Math.max(...values) : null;
  }
  function period(from,to){
    const start = midnight + from*hour, end = midnight + to*hour;
    const samples = rows.filter(x => x.at >= start && x.at < end);
    const feels = avg(samples.map(x => x.feels));
    const humidity = avg(samples.map(x => x.humidity));
    return {feels:feels === null ? null : Math.round(feels*10)/10,
      humidity:humidity === null ? null : Math.round(humidity), rainProb:rainBetween(start,end)};
  }
  const now = new Date();
  const current = rows.reduce((best,row) => Math.abs(row.at-now) < Math.abs(best.at-now) ? row : best);
  const weatherDescription = el("天氣現象").find(x => Date.parse(x.StartTime) <= current.at &&
    current.at < Date.parse(x.EndTime))?.ElementValue?.[0]?.Weather;
  const allDay = period(0,24);
  const periods = [["早上",6,11],["中午",11,14],["下午",14,18],["晚上",18,24]].map(([label,from,to]) =>
    Object.assign({label},period(from,to)));
  const day = period(6,18), night = period(18,24);
  return {place:`${place.county}${place.town}`, gps:place.gps, source:"中央氣象署", date:TODAY,
    at:`${pad(now.getHours())}:${pad(now.getMinutes())}`, fetchedAt:now.getTime(),
    dayFeels:day.feels, dayRainProb:day.rainProb, dayHumidity:day.humidity,
    nightFeels:night.feels, nightRainProb:night.rainProb, nightHumidity:night.humidity,
    currentFeels:current.feels, currentRainProb:rainBetween(current.at,current.at+1), currentHumidity:current.humidity,
    high:Math.max(...rows.map(x => x.temp)), low:Math.min(...rows.map(x => x.temp)),
    rainProb:allDay.rainProb, humidity:allDay.humidity, desc:weatherDescription || "", periods};
}

/* ---------- Google 雲端硬碟同步（只會看到這個 App 自己建立的檔案） ---------- */
const Sync = {
  FILE: "香水櫃備份.json",
  token: null, exp: 0, client: null, timer: null, busy: false, dirty: !!lsGet("gd-dirty"),
  get on(){ return !!lsGet("gd-on"); },
  get last(){ return lsGet("gd-last"); },
  init(){
    if (!GOOGLE_CLIENT_ID) return;
    const s = document.createElement("script");
    s.src = "https://accounts.google.com/gsi/client"; s.async = true;
    s.onload = () => {
      this.client = google.accounts.oauth2.initTokenClient({
        client_id: GOOGLE_CLIENT_ID, scope: "https://www.googleapis.com/auth/drive.file",
        callback: r => {
          if (r.error) { toast("Google 登入沒有完成"); this.chip(); return; }
          this.token = r.access_token; this.exp = Date.now() + (num(r.expires_in, 3600) - 60) * 1000;
          lsSet("gd-on", true); this.run();
        },
        error_callback: () => this.chip()
      });
      this.chip();
    };
    document.head.appendChild(s);
  },
  valid(){ return !!this.token && Date.now() < this.exp; },
  // 一定要在點擊事件裡、任何 await 之前呼叫，iPhone 才會讓登入視窗跳出來
  connect(){
    if (!this.client) { toast(GOOGLE_CLIENT_ID ? "Google 登入元件還在載入，請稍後再試" : "Google 同步還沒設定好"); return; }
    this.client.requestAccessToken({prompt: this.on ? "" : "consent"});
  },
  stop(){ lsSet("gd-on", false); lsSet("gd-file", null); this.token = null; this.chip(); render(); toast("已停止同步，雲端上的備份檔還在"); },
  schedule(){
    this.dirty = true; lsSet("gd-dirty", true); clearTimeout(this.timer);
    if (this.on && this.valid()) this.timer = setTimeout(() => this.run(), 1500);
    this.chip();
  },
  async api(url, opt = {}){
    const r = await fetch(url, Object.assign({}, opt, {headers: Object.assign({Authorization: "Bearer " + this.token}, opt.headers || {})}));
    if (r.status === 401) { this.token = null; throw new Error("auth"); }
    if (!r.ok) throw new Error("http " + r.status);
    return r;
  },
  async findFile(){
    let id = lsGet("gd-file");
    if (id) return id;
    const q = encodeURIComponent(`name='${this.FILE}' and trashed=false`);
    const res = await this.api(`https://www.googleapis.com/drive/v3/files?q=${q}&spaces=drive&orderBy=modifiedTime%20desc&fields=files(id)`).then(r => r.json());
    id = res.files && res.files[0] ? res.files[0].id : null;
    if (id) lsSet("gd-file", id);
    return id;
  },
  async run(){
    if (this.busy || !this.valid()) { this.chip(); return; }
    this.busy = true; this.chip();
    try {
      let id = await this.findFile(), remote = null;
      if (id) {
        try { remote = await this.api(`https://www.googleapis.com/drive/v3/files/${id}?alt=media`).then(r => r.json()); }
        catch (e) { if (e.message !== "http 404") throw e; lsSet("gd-file", null); id = await this.findFile(); }
      }
      if (remote && Store.merge(remote)) Store.save(false);
      const body = JSON.stringify(Object.assign({app:"perfume-cabinet", savedAt:new Date().toISOString()}, Store.data));
      if (id) {
        await this.api(`https://www.googleapis.com/upload/drive/v3/files/${id}?uploadType=media`, {method:"PATCH", headers:{"Content-Type":"application/json"}, body});
      } else {
        const bd = "pcb" + Date.now();
        const multi = `--${bd}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify({name:this.FILE, mimeType:"application/json"})}\r\n` +
          `--${bd}\r\nContent-Type: application/json\r\n\r\n${body}\r\n--${bd}--`;
        const res = await this.api("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id",
          {method:"POST", headers:{"Content-Type":"multipart/related; boundary=" + bd}, body:multi}).then(r => r.json());
        lsSet("gd-file", res.id);
      }
      this.dirty = false; lsSet("gd-dirty", false); lsSet("gd-last", Date.now());
    } catch (e) { if (e.message !== "auth") toast("同步到 Google 雲端硬碟失敗，下次會再試"); }
    this.busy = false; this.chip();
    if (S.view === "prefs") render();
  },
  chip(){
    const c = $("#sync-chip"); if (!c) return;
    if (!GOOGLE_CLIENT_ID || !this.on) { c.hidden = true; return; }
    c.hidden = false;
    const ok = this.valid();
    c.textContent = this.busy ? "同步中…" : ok ? (this.dirty ? "等待同步" : "☁ 已同步") : (this.dirty ? "☁ 點一下同步" : "☁ 已備份");
    c.dataset.state = !ok && this.dirty ? "need" : "ok";
  }
};

/* ---------- recommendation ---------- */
// last：每支最後一次噴的日期；count：噴過幾天（同一天補香只算一天）
function lastWorn(before){
  const m = {}, c = {}, seen = new Set();
  for (const {date, perfumeId} of S.wearList) {
    if (before && date >= before) continue;
    const key = perfumeId + "|" + date;
    if (!seen.has(key)) { seen.add(key); c[perfumeId] = (c[perfumeId] || 0) + 1; }
    if (!m[perfumeId] || date > m[perfumeId]) m[perfumeId] = date;
  }
  return {last:m, count:c};
}
function profile(p){
  // 清爽／厚重程度：用主要香調的比例加權（0–1）
  const measured = Array.isArray(p.accords) ? p.accords.filter(a => Array.isArray(a) && num(a[1],0) > 0).slice(0,6) : [];
  const families = Array.isArray(p.families) ? p.families : [];
  const acc = measured.length ? measured : families.map(f => [f, 100]);
  if (!acc.length) return null;
  const tot = acc.reduce((a,[,v]) => a + v, 0);
  const part = list => acc.reduce((a,[k,v]) => a + (list.includes(k) ? v : 0), 0) / tot;
  return {fresh: part(FRESH), heavy: part(HEAVY)};
}
function recommend(today, ctx){
  const t = ctx.temp, night = isNightOcc(ctx.occ);
  const weights = Object.entries(SEASON_CENTER).map(([key,center]) => [key, Math.exp(-(((t-center)/5) ** 2))]);
  const totalWeight = weights.reduce((sum,[,weight]) => sum + weight,0);
  return S.perfumes.filter(p => isOwned(p) && p.remaining !== "empty").map(p => {
    let s = 0; const why = [], tips = [];
    const st = num(p.strength, 3);
    const sea = p.seasons;
    if (sea) {
      // 以相同的中性值計算有票數和缺少票數的款式。
      const suitability = value => Math.max(0,Math.min(100,num(value,NEUTRAL_SUITABILITY)));
      const fit = totalWeight ? weights.reduce((sum,[key,weight]) => sum + weight*suitability(sea[key]),0)/totalWeight : NEUTRAL_SUITABILITY;
      const seasonScore = (fit - NEUTRAL_SUITABILITY) * .05;
      s += seasonScore;
      // 理由寫出今天的體感最接近哪個季節，以及網友票選的分數
      const [mainSeason] = weights.reduce((best, cur) => cur[1] > best[1] ? cur : best);
      if (fit >= 80) why.push([seasonScore, `${t}°C 偏${SEASON[mainSeason]}天，網友票選${SEASON[mainSeason]}季適用度 ${Math.round(suitability(sea[mainSeason]))}`]);
      const dn = suitability(sea[night ? "night" : "day"]);
      const timeScore = (dn - NEUTRAL_SUITABILITY) * .02;
      s += timeScore;
      if (night && dn >= 85) why.push([timeScore, `網友票選晚上適用度 ${Math.round(dn)}`]);
    } else if (Number.isFinite(p.tMin) && Number.isFinite(p.tMax)) {
      const lo = p.tMin, hi = p.tMax;
      if (t >= lo && t <= hi) { s += 2.5; why.push([2.5, `${t}°C 在它的舒適溫度 ${lo}–${hi}°C 之間`]); }
      else s -= (t < lo ? lo - t : t - hi) * 0.45;
    }
    if (ctx.wet) {
      const scent = profile(p);
      if (scent) {
        const wetScore = (scent.fresh - .4) * 2.5 - scent.heavy * 1.5;
        s += wetScore;
        if (wetScore > 0 && scent.fresh >= .5) why.push([wetScore, "清爽香調適合潮濕天氣"]);
      }
      if (st >= 4.5) s -= 1;
    }
    // 符合場合照樣加分，但不寫成理由（你已經選了場合，再寫一次是重複的）
    if (p.occ?.includes(ctx.occ)) s += 2.5;
    else if (p.occ?.length) s -= 1;
    if (ctx.occ === "office" && st >= 4.5) s -= 1.5;
    if (["date","night","formal"].includes(ctx.occ) && num(p.longevity,3) >= 4) {
      s += .6; why.push([.6, "留香較久，適合時間較長的場合"]);
    }
    const r = Math.max(1,Math.min(5,num(p.rating,3))), ratingScore = (r-3) * .7;
    s += ratingScore;
    if (r >= 5) why.push([ratingScore, "你給它滿分"]); else if (r >= 4) why.push([ratingScore, "你的高分愛用款"]);
    if (st >= 4.5) tips.push("擴散很強，噴 1–2 下就夠");
    else if (ctx.occ === "office" && st >= 4) tips.push("辦公室裡噴 2 下以內");
    s += jitter(today + p.id) * .8;
    if (!why.length) why.push([0, `綜合今天的天氣和${OCC[ctx.occ] || "場合"}，分數最高`]);
    why.sort((a,b) => b[0]-a[0]);
    return {p, score:s, why: why.slice(0,3).map(x => x[1]), tips};
  }).sort((a,b) => b.score - a.score);
}

// 「其他選擇」的理由：寫出它和主推薦哪裡不一樣，三支盡量不重複
function altReasons(main, alts){
  const used = new Set();
  const mp = profile(main.p) || {fresh:0, heavy:0}, mf = main.p.families || [];
  return alts.map(r => {
    const p = r.p, pp = profile(p) || {fresh:0, heavy:0}, options = [];
    if (pp.fresh - mp.fresh >= .2) options.push("比主推薦更清爽");
    if (pp.heavy - mp.heavy >= .2) options.push("比主推薦更溫暖厚重");
    const fam = (p.families || []).find(f => !mf.includes(f));
    if (fam) options.push(`換個口味：${accName(fam)}調`);
    const dl = num(p.longevity, NaN) - num(main.p.longevity, NaN);
    if (dl >= 1) options.push("留香比較久");
    if (dl <= -1) options.push("比較輕盈，不會留太久");
    const ds = num(p.strength, NaN) - num(main.p.strength, NaN);
    if (ds >= 1) options.push("擴散比較強，存在感高");
    if (ds <= -1) options.push("比較低調，適合近距離");
    if (num(p.rating,0) >= 4 && num(p.rating,0) > num(main.p.rating,0)) options.push("你評分比較高的愛用款");
    options.push(...r.why.filter(w => !w.startsWith("綜合今天")));
    const pick = options.find(o => !used.has(o)) || "同樣適合今天的天氣";
    used.add(pick);
    return pick;
  });
}

function renderToday(){
  const el = $("#v-today"), c = S.ctx;
  const occChips = Object.entries(OCC).map(([k,v]) => `<button class="chip" data-act="occ" data-v="${k}" aria-pressed="${c.occ===k}">${v}</button>`).join("");
  let html = renderWeather() + `<div class="occasions" role="group" aria-label="今天的場合">${occChips}</div>`;
  if (!S.perfumes.length) { el.innerHTML = html + emptyState(); return; }

  const recs = recommend(TODAY, c);
  const todayWears = wearsOn(TODAY);
  const latest = todayWears[todayWears.length - 1];
  const worn = latest && byId(latest.perfumeId);
  if (!worn && !recs.length) {
    el.innerHTML = html + '<div class="card empty-state">目前沒有可推薦的香水。到香水櫃更新剩量或新增香水。</div>';
    return;
  }
  const offset = recs.length ? S.offset % recs.length : 0;
  const ordered = worn ? recs : recs.slice(offset).concat(recs.slice(0,offset));
  const main = worn ? {p:worn, why:[], tips:[]} : ordered[0];
  const p = main.p, alts = ordered.filter(r => r.p.id !== p.id).slice(0,3);
  const altWhy = altReasons(main, alts);
  // 已記錄時顯示「今天以前」最後一次噴的時間，才不會和「已記錄」互相矛盾
  const prev = lastWorn(worn ? TODAY : null).last[p.id];
  const prevText = prev ? sinceText(prev) : worn ? "第一次噴" : "未噴過";
  const timeline = todayWears.length ? `<ol class="wear-timeline" aria-label="今天的使用紀錄">${todayWears.map((w,i) => {
    const wp = byId(w.perfumeId), refill = todayWears.slice(0,i).some(x => x.perfumeId === w.perfumeId);
    return `<li><span class="mono">${esc(w.time || "—")}</span><span>${esc(wp?.name || "已移除的香水")}</span>${refill ? '<span class="refill">補香</span>' : ""}</li>`;
  }).join("")}</ol>` : "";
  html += `<article class="card pick" style="--c:${famColor(p)}">
    <div class="eyebrow">${worn ? (todayWears.length > 1 ? `今天記錄了 ${todayWears.length} 次 · 最近一次` : "今天噴的是") : "今日推薦"}</div>
    <div class="pick-top">
      <div style="min-width:0">
        <div class="brand">${esc([p.brand, p.conc].filter(Boolean).join(" · "))}</div>
        <div class="pname">${esc(p.name)}</div>
        <div class="chips">${famChips(p)}</div>
      </div>
      ${photo(p, "ph-lg", "eager")}
    </div>
    <div class="actions today-actions">
      ${worn ? `<span class="done-badge">✓ 已記錄${p.remaining === "empty" ? " · 已用完" : ""}</span>
               <button class="btn primary" data-act="wear" data-id="${esc(p.id)}">補香</button>
               <button class="btn ghost" data-act="open" data-id="${esc(p.id)}">詳情</button>`
             : `<button class="btn primary" data-act="wear" data-id="${esc(p.id)}">今天噴這支</button>${alts.length ? '<button class="btn ghost" data-act="shuffle">換一支</button>' : ""}<button class="btn ghost" data-act="open" data-id="${esc(p.id)}">詳情</button>`}
    </div>
    ${timeline}
    ${main.why.length ? `<ul class="why">${main.why.map(w => `<li>${esc(w)}</li>`).join("")}</ul>` : ""}
    ${main.tips.length ? `<div class="tips">${main.tips.map(esc).join("・")}</div>` : ""}
    <div class="facts">
      <div>${metric("擴散度", p.strength)}</div>
      <div>${metric("持久度", p.longevity)}</div>
      <div><span class="label">${worn ? "前一次噴" : "上次噴"}</span><b>${esc(prevText)}</b></div>
    </div>
  </article>`;
  if (alts.length) html += `<h2>${worn ? "想換一支的話" : "其他選擇"}</h2>
  <div class="alts">${alts.map((r,i) => `<button class="alt" data-act="open" data-id="${esc(r.p.id)}" style="--c:${famColor(r.p)}">
      <span class="bar"></span>${photo(r.p, "ph-sm")}
      <span style="min-width:0"><span class="n">${esc(r.p.name)}</span><br><span class="s">${esc(altWhy[i])}</span></span>
    </button>`).join("")}</div>`;
  el.innerHTML = html;
}

function renderShelfResults(){
  const results = $("#shelf-results");
  if (!S.perfumes.length) { results.innerHTML = emptyState(); return; }
  const q = S.q.trim();
  const list = S.perfumes.filter(p => {
    const families = p.families || [];
    const inGroup = S.stock === "wish" || S.stock === "tried" ? p.own === S.stock :
      isOwned(p) && (S.stock === "all" || (p.remaining === "empty") === (S.stock === "empty"));
    return inGroup && (!S.fam || families.includes(S.fam)) &&
      matchesCatalog(q,...catalogSearchFields(p),p.notes,p.memo,...families.map(accName));
  }).sort(comparePerfumes);
  if (!list.length) {
    const message = q || S.fam ? "沒有符合的香水" : {
      empty:"目前沒有已用完的香水", wish:"願望清單是空的。按「新增香水」，類型選「想買」。",
      tried:"還沒有試香紀錄。按「新增香水」，類型選「試香過」。"}[S.stock] || "目前沒有現有香水";

function renderLog(){
  const el = $("#v-log");
  const [y, m] = S.calMonth.split("-").map(Number);
  const first = new Date(y, m-1, 1), dim = new Date(y, m, 0).getDate();
  let cal = WEEK.split("").map(d => `<div class="dow">${d}</div>`).join("");
  for (let i = 0; i < first.getDay(); i++) cal += `<div class="day blank"></div>`;
  let monthCount = 0;
  for (let d = 1; d <= dim; d++) {
    const ds = `${y}-${pad(m)}-${pad(d)}`, entries = wearsOn(ds);
    const bottles = [...new Set(entries.map(w => w.perfumeId))].map(byId).filter(Boolean);
    if (entries.length) monthCount++;
    const future = ds > TODAY;
    const extra = bottles.length > 1 ? `+${bottles.length - 1}` : entries.length > 1 ? `×${entries.length}` : "";
    cal += `<button class="day ${ds===TODAY?"is-today":""} ${future?"future":""}" ${future?"disabled":""} data-act="day" data-v="${ds}" aria-label="${m}月${d}日${bottles.length ? "，" + esc(bottles.map(p => p.name).join("、")) : ""}">
      <span class="dn">${d}</span>${bottles.length ? `<span class="cal-bottle">${photo(bottles[0], "ph-cal")}${extra ? `<span class="cal-more">${extra}</span>` : ""}</span>` : ""}</button>`;
  }
  // stats（同一天同一支只算一次）
  const since90 = ymd(new Date(Date.now() - 90*864e5));
  const cnt = {}, seen = new Set();
  S.wearList.forEach(({date,perfumeId}) => {
    const key = perfumeId + "|" + date;
    if (date >= since90 && !seen.has(key)) { seen.add(key); cnt[perfumeId] = (cnt[perfumeId]||0)+1; }
  });
  const top = Object.entries(cnt).filter(([id]) => byId(id)).sort((a,b) => b[1]-a[1]).slice(0,5);
  const {last} = lastWorn(null);
  const cold = S.perfumes.filter(p => isOwned(p) && p.remaining !== "empty").map(p => [p, last[p.id]]).sort((a,b) => (a[1]||"0") < (b[1]||"0") ? -1 : 1).slice(0,5);
  el.innerHTML = `<div class="card">
      <div class="cal-head"><button data-act="month" data-v="-1" aria-label="上個月">‹</button><b>${y} 年 ${m} 月</b><button data-act="month" data-v="1" aria-label="下個月">›</button></div>
      <div class="cal">${cal}</div>
      <p class="small muted" style="margin:10px 0 0">這個月噴了 <b class="mono">${monthCount}</b> 天。點日期可以補記或修改。</p>
    </div>
    <div class="stats">
      <div class="card"><div class="label">近 90 天最常用</div>${top.length ? `<ol class="rank">${top.map(([id,n]) => `<li><span>${esc(byId(id).name)}</span><span class="mono">${n} 天</span></li>`).join("")}</ol>` : `<p class="small muted" style="margin:6px 0 0">還沒有紀錄。在「今日」按「今天噴這支」就會開始累積。</p>`}</div>
      <div class="card"><div class="label">冷落最久</div><ol class="rank">${cold.map(([p,d]) => `<li><span>${esc(p.name)}</span><span class="mono">${esc(sinceText(d))}</span></li>`).join("")}</ol></div>
    </div>`;
}

let pageScrollY = 0;

function openSheet(html){
  const sheet = $("#sheet");

    document.body.style.top = `-${pageScrollY}px`;

  $("#sheet-body").innerHTML = html;
  sheet.hidden = false;

const hasFullDetails = p => !!(fragranticaId(p.source) && p.seasons && p.accords?.length && p.votes);
function missingDetails(p){
  if (hasFullDetails(p)) return "";
  const linked = !!fragranticaId(p.source);
  return `<div class="missing-details">
    <div class="small">${linked ? "已連到 Fragrantica，但還沒有網友的季節投票和香調比例。" : "還沒有 Fragrantica 的瓶身照、季節投票和香調比例。"}

  </div>`;

// 願望清單／試香：找出香調比例最接近的、你已經有的香水
function similarOwned(p){
  const vec = x => Object.fromEntries((x.accords || []).map(([k,v]) => [k, num(v,0)]));
  const a = vec(p), norm = v => Math.sqrt(Object.values(v).reduce((s,x) => s + x*x, 0));
  if (!norm(a)) return "";
  let best = null, bestSim = 0;
  for (const q of S.perfumes) {
    if (!isOwned(q) || q.id === p.id) continue;
    const b = vec(q), nb = norm(b);
    if (!nb) continue;
    const sim = Object.keys(a).reduce((s,k) => s + a[k] * (b[k] || 0), 0) / (norm(a) * nb);
    if (sim > bestSim) { bestSim = sim; best = q; }
  }
  return best ? `<button class="similar" data-act="open" data-id="${esc(best.id)}">${photo(best,"ph-sm")}
    <span>跟你的 <b>${esc(best.name)}</b> 最像<br><span class="small muted">香調相似度 ${Math.round(bestSim*100)}%</span></span></button>` : "";
}

function fragranticaSearch(brand, name){
  const query = [brand,name].map(value => String(value ?? "").trim()).filter(Boolean).join(" ");
  return "https://www.fragrantica.com/search/#q=" + encodeURIComponent(query);
}

const VERSION_CONCENTRATIONS = {
  edt:"eau de toilette", edp:"eau de parfum", edc:"eau de cologne",
  parfum:"parfum", extrait:"extrait de parfum"
};
const CONCENTRATION_LABELS = {
  edt:"淡香水（EDT）", edp:"淡香精（EDP）", edc:"古龍水（EDC）",
  parfum:"香精（Parfum）", extrait:"高濃度香精（Extrait）"
};
const VERSION_SUFFIX = /(?:^| )(extrait de parfum|eau de toilette|eau de parfum|eau de cologne|edt|edp|edc|parfum|extrait)$/;
const SCENTO_API = "https://www.scento.com/api/perfume/v1";
const versionCache = new Map();

function catalogText(value){
  const raw = String(value ?? "").normalize("NFKD").replace(/[\p{M}'’]/gu,"");
  const latin = raw.replace(/\p{Script=Han}+/gu," ");
  return (/[a-z]/i.test(latin) ? latin : raw).toLowerCase().replace(/[^\p{L}\p{N}]+/gu," ").trim();
}
const catalogName = value => catalogText(value).replace(VERSION_SUFFIX,"");
function catalogConc(value){
  const normalized = catalogText(value);
  return Object.entries(VERSION_CONCENTRATIONS).find(([short,long]) => normalized === short || normalized === long)?.[0] || normalized;
}
const versionKey = p => JSON.stringify([catalogText(p.brand),catalogName(p.name),catalogConc(p.conc)]);
const concentrationLabel = value => CONCENTRATION_LABELS[catalogConc(value)] || value || "未設定";

function versionOptions(requested){
  const candidates = [...(Store.bundle?.perfumes || []), ...(Store.bundle?.variants || [])];
  return candidates.filter(item => versionKey({...requested,conc:item.conc}) === versionKey(item));
}

async function readScento(path){
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(),4500);
  try {
    const response = await fetch(SCENTO_API+path,{signal:controller.signal});
    if (!response.ok) throw new Error("Scento "+response.status);
    return await response.json();
  } finally {
    clearTimeout(timer);
  }
}

// Scento 的香氣描述詞 → App 的香調分類
const SCENTO_WORDS = {citrusy:"citrus",citrus:"citrus",fresh:"fresh",aquatic:"aquatic",marine:"aquatic",watery:"aquatic",green:"green",
  herbal:"herbal",aromatic:"aromatic",woody:"woody",earthy:"earthy",mossy:"mossy",spicy:"warmspicy",peppery:"freshspicy",warm:"amber",
  amber:"amber",ambery:"amber",resinous:"balsamic",balsamic:"balsamic",smoky:"smoky",leathery:"leather",leather:"leather",powdery:"powdery",
  musky:"musky",floral:"floral",rosy:"rose",sweet:"sweet",gourmand:"sweet",vanilla:"vanilla",fruity:"fruity",oud:"oud",animalic:"animalic",
  metallic:"metallic",mineral:"mineral",lavender:"lavender",iris:"powdery",tobacco:"smoky",boozy:"sweet",creamy:"sweet"};
function scentoProfile(answer,requested){
  const d = answer.detail;
  if (!d?.name || versionKey({brand:d.house,name:d.name,conc:d.concentration}) !== versionKey(requested)) return null;
  const notes = NOTE_FIELDS.flatMap(([key,label]) => {
    const list = key === "overall" ? d.notes : d.pyramid?.[key];
    const names = Array.isArray(list) ? list.filter(value => typeof value === "string" && value.trim()).map(zhNote) : [];
    return names.length ? [label+"："+names.join("、")] : [];
  }).join("｜");
  if (!notes) return null;
  const url = answer.scento_page?.url;
  const profile = {brand:requested.brand,name:d.name,conc:requested.conc,notes,
    catalogSource:/^https:\/\/www\.scento\.com\//.test(url || "") ? url : "https://www.scento.com/developers/perfume-api"};
  // 適合季節與時段：Scento 列出的給 85，沒列的給 40（Fragrantica 網友投票補上後會被取代）
  const seasons = (d.wears?.seasons || []).map(s => s === "autumn" ? "fall" : s);
  const hours = d.wears?.hours || [];
  if (seasons.length || hours.length) profile.seasons = {
    spring: seasons.includes("spring") ? 85 : 40, summer: seasons.includes("summer") ? 85 : 40,
    fall: seasons.includes("fall") ? 85 : 40, winter: seasons.includes("winter") ? 85 : 40,
    day: hours.includes("day") ? 85 : 40, night: hours.some(h => h === "evening" || h === "night") ? 85 : 40};
  const families = [...new Set((d.character_words || []).map(w => SCENTO_WORDS[String(w).toLowerCase()]).filter(Boolean))].slice(0,3);
  if (families.length) { profile.families = families; profile.accords = families.map((k,i) => [k, 100 - i*15]); }
  return profile;
}

async function lookupPerfumeVersion(requested){
  const key = versionKey(requested);
  const title = catalogName(requested.name);
  const brand = catalogText(requested.brand);
  const conc = VERSION_CONCENTRATIONS[catalogConc(requested.conc)];
  if (!title || !brand || !conc) return null;
  const local = versionOptions(requested).filter(item => versionKey(item) === key);
  if (local.length === 1) return local[0];
  if (local.length > 1) return null;
  if (versionCache.has(key)) return versionCache.get(key);

  const checkPortrait = async name => {
    const answer = await readScento("/perfumes/"+encodeURIComponent(name));
    return scentoProfile(answer,requested);
  };
  const direct = await checkPortrait(title+" "+conc);
  if (direct) {
    versionCache.set(key,direct);
    return direct;
  }
  const search = await readScento("/search?"+new URLSearchParams({q:brand+" "+title,kind:"perfume"}));
  const alternatives = (search.detail?.matches || []).filter(item =>
    catalogText(item.house) === brand && catalogName(item.name) === title);
  const terms = [...new Set(alternatives.map(item =>
    item.page?.match(/^https:\/\/www\.scento\.com\/perfumes\/([a-z\d-]+)$/i)?.[1] || item.name))].slice(0,3);
  const results = (await Promise.all(terms.map(checkPortrait))).filter(Boolean);
  const match = results.length === 1 ? results[0] : null;
  if (match) versionCache.set(key,match);
  return match;
}

function applyPerfumeVersion(p,version){
  // 舊版的資料與數值不可沿用；個人評分、剩量、備註、自訂照片、紀錄 ID 由原品項保留。
  for (const key of ["votes","seasons","tMin","tMax"]) delete p[key];
  Object.assign(p, {
    name:version.name, conc:version.conc, notes:version.notes || "",
    source:version.source || "", catalogSource:version.catalogSource || "", catalogImage:version.catalogImage || "",
    families:version.families || [], accords:version.accords || [],
    strength:version.strength ?? null, longevity:version.longevity ?? null,
    fragranticaRating:version.fragranticaRating ?? null, customVersion:true
  });
  if (version.seasons) p.seasons = version.seasons;
  if (version.votes) p.votes = version.votes;
}

const CATALOG_BRAND_ALIASES = {
  "Hermès":["愛馬仕"], Chanel:["香奈兒"], Dior:["迪奧"], "Louis Vuitton":["LV","路易威登"],
  Montblanc:["萬寶龍"], Creed:["信仰"], Prada:["普拉達"], Burberry:["巴寶莉"], Diptyque:["蒂普提克"]
};
const searchText = value => String(value ?? "").normalize("NFKD").toLowerCase().replace(/[\p{M}'’]/gu,"")
  .replace(/[^\p{L}\p{N}]+/gu," ").trim();
const brandAlias = brand => Object.keys(CATALOG_BRAND_ALIASES).find(name => catalogText(name) === catalogText(brand));
function matchesCatalog(query,...values){
  const haystack = searchText(values.join(" "));
  return searchText(query).split(" ").every(word => haystack.includes(word));
}
function catalogSearchFields(p){
  return [p.name,p.brand,p.conc,...(CATALOG_BRAND_ALIASES[brandAlias(p.brand)] || [])];
}
function searchLocalCatalog(query){
  const unique = new Map();
  const items = [...(Store.bundle?.perfumes || []), ...(Store.bundle?.variants || []), ...S.perfumes];
  for (const p of items) if (p.brand && p.name && !unique.has(versionKey(p))) unique.set(versionKey(p),p);
  const perfumes = [...unique.values()].filter(p => matchesCatalog(query,...catalogSearchFields(p)));
  const brands = [...new Set([...Object.keys(CATALOG_BRAND_ALIASES), ...items.map(p => p.brand).filter(Boolean)])]
    .filter(brand => matchesCatalog(query,brand,...(CATALOG_BRAND_ALIASES[brandAlias(brand)] || [])));
  return {brands,perfumes};
}
function remoteCatalogQuery(query){
  const alias = Object.entries(CATALOG_BRAND_ALIASES).find(([,names]) => names.some(name => searchText(name) === searchText(query)));
  return alias ? alias[0] : query;
}
function matchingBottle(p){
  if (!p.brand || !p.name) return null;
  const key = bottle => versionKey(Object.assign({},bottle,{brand:remoteCatalogQuery(bottle.brand)}));
  const requested = key(p);
  const matches = S.perfumes.filter(item => key(item) === requested);
  return matches.find(item => item.remaining !== "empty") || matches[0] || null;
}
function duplicateNotice(p){
  if (!p) return "";
  const empty = p.remaining === "empty";
  const label = p.own === "wish" ? "願望清單裡有這支" : p.own === "tried" ? "試香紀錄裡有這支" : empty ? "同款已用完" : "已收藏同款";
  return `<div>${label} · <b>${esc(p.name)}</b></div>
    <div class="actions">
      <button class="btn ghost" type="button" data-act="open" data-id="${esc(p.id)}">查看已收藏</button>
      ${empty ? `<button class="btn ghost" type="button" data-act="restock" data-id="${esc(p.id)}">補貨並恢復推薦</button>` : ""}
    </div>`;
}
async function loadCatalogChoice(choice){
  if (choice.local) return choice.local;
  const {brand,name,term} = choice;
  const draft = {brand,name};
  try {
    const answer = await readScento("/perfumes/"+encodeURIComponent(term || name));
    const {detail} = answer;
    if (catalogText(detail?.house) !== catalogText(brand) || catalogName(detail?.name) !== catalogName(name)) return draft;
    const selected = catalogConc(detail.concentration);
    const conc = selected === "parfum" ? "Parfum" : selected === "extrait" ? "Extrait" : selected.toUpperCase();
    const namedConc = name && searchText(name).match(VERSION_SUFFIX)?.[1];
    if (namedConc && catalogConc(namedConc) !== selected) return draft;
    return scentoProfile(answer,{brand,name,conc}) || {...draft,conc};
  } catch {
    return draft;
  }
}
function wireCatalogSearch(formIsOpen){
  const input = $("#f-catalog-search");
  if (!input) return;
  const results = $("#f-catalog-results"), status = $("#f-catalog-status");
  const cache = new Map();
  let timer, generation = 0, choices = [];
  function show(query,online=[], message=""){
    const local = searchLocalCatalog(query), brands = new Map(local.brands.map(brand => [catalogText(brand),brand]));
    const perfumes = local.perfumes.map(p => ({name:p.name,brand:p.brand,conc:p.conc,local:p}));
    for (const entry of online) {
      if (entry.kind === "house" && entry.name) brands.set(catalogText(entry.name),entry.name);
      if (entry.kind !== "perfume" || !entry.name || !entry.house) continue;
      const suffix = searchText(entry.name).match(VERSION_SUFFIX)?.[1];
      const duplicate = perfumes.some(p => catalogText(p.brand) === catalogText(entry.house) &&
        catalogName(p.name) === catalogName(entry.name) && (!suffix || catalogConc(p.conc) === catalogConc(suffix)));
      if (!duplicate) perfumes.push({name:entry.name,brand:entry.house,
        term:entry.page?.match(/^https:\/\/www\.scento\.com\/perfumes\/([a-z\d-]+)$/i)?.[1]});
    }
    choices = [...[...brands.values()].slice(0,2).map(brand => ({brand})), ...perfumes.slice(0,6)];
    results.innerHTML = choices.map(({brand,name,conc},i) => `<button type="button" class="catalog-choice" data-catalog-choice="${i}">
      <span>${esc(name || brand)}${name ? `<br><span class="small muted">${esc([brand,conc].filter(Boolean).join(" · "))}</span>` : ""}</span>
      ${name ? "" : '<span class="small muted">選用品牌</span>'}
    </button>`).join("");
    status.textContent = message || (choices.length ? "" : "找不到相符的品牌或香水，可以手動新增。");
    status.hidden = !status.textContent;
  }
  function update(immediate){
    clearTimeout(timer);
    const requested = ++generation;
    const query = input.value.trim();
    if (!searchText(query) || (query.length < 2 && !/\p{Script=Han}/u.test(query))) {
      choices = []; results.innerHTML = ""; status.hidden = true;
      return;
    }
    const phrase = remoteCatalogQuery(query);
    const key = searchText(phrase);
    if (cache.has(key)) {
      show(query,cache.get(key));
      return;
    }
    show(query,[],"正在搜尋香水資料…");
    timer = setTimeout(async () => {
      try {
        const response = await readScento("/search?"+new URLSearchParams({q:phrase,kind:"any"}));
        const online = (response.detail?.matches || []).filter(p => matchesCatalog(phrase,p.name,p.house));
        cache.set(key,online);
        if (formIsOpen() && generation === requested) show(query,online);
      } catch {
        if (formIsOpen() && generation === requested) show(query,[],"暫時無法搜尋線上資料，可以手動新增。");
      }
    },immediate ? 0 : 320);
  }
  input.addEventListener("input", () => update(false));
  input.addEventListener("keydown", e => {
    if (e.key === "Enter") { e.preventDefault(); update(true); }
  });
  results.addEventListener("click", async e => {
    const button = e.target.closest("[data-catalog-choice]");
    const choice = button && choices[Number(button.dataset.catalogChoice)];
    if (!choice) return;
    const selected = ++generation;
    clearTimeout(timer);
    if (!choice.name) {
      const brand = $("#f-brand");
      brand.value = choice.brand;
      brand.dispatchEvent(new Event("input",{bubbles:true}));
      status.textContent = `已填入品牌 ${choice.brand}`;
      status.hidden = false;
      return;
    }
    button.disabled = true;
    status.textContent = "正在帶入香水資料…";
    status.hidden = false;
    const fields = () => [$("#f-brand").value,$("#f-name").value,$("#f-conc").value].join("\n");
    const before = fields();
    const draft = await loadCatalogChoice(choice);
    button.disabled = false;
    if (formIsOpen() && generation === selected) {
      status.hidden = true;
      if (fields() === before) editSheet(null,Object.assign({},draft,{memo:$("#f-memo").value,
        own:document.querySelector("#f-own .chip[aria-pressed='true']")?.dataset.v || "", triedOn:$("#f-tried")?.value}));
    }
  });
}

function editSheet(id,draft=null){
  const catalogFields = ["brand","name","conc","families","accords","notes","seasons","strength","longevity",
    "occ","source","catalogSource","catalogImage","fragranticaRating","votes","memo","own","triedOn"];
  const p = id ? byId(id) : Object.assign(
    {brand:"", name:"", conc:"", families:[], notes:"", occ:[], rating:null, remaining:null,
      own:["wish","tried"].includes(S.stock) ? S.stock : ""},
    Object.fromEntries(catalogFields.filter(key => draft && key in draft).map(key => [key,draft[key]]))

  if (!p) return;

  const tog = (act, map, sel) => Object.entries(map).map(([k,v]) => `<button type="button" class="chip" data-act="${act}" data-v="${k}" aria-pressed="${(sel||[]).includes(k)}">${v}</button>`).join("");
  const accSel = (p.accords && p.accords.length) ? p.accords.map(a => a[0]) : (p.families || []);
  const seaSel = p.seasons ? Object.keys(SEASON).filter(k => num(p.seasons[k],0) >= 70) : [];
  const concentrations = [...new Set(["", "EDT", "EDP", "Parfum", "Extrait", "EDC", p.conc || ""])];

        <div class="small muted" id="f-catalog-status" role="status" hidden></div>
        <div class="catalog-results" id="f-catalog-results"></div>
      </div>`}
      <div class="field"><label for="f-brand">品牌</label><input id="f-brand" value="${esc(p.brand)}" required></div>
      <div class="field"><label for="f-name">香水名稱</label><input id="f-name" value="${esc(p.name)}" required></div>
      <div class="field"><label for="f-conc">濃度（選填）</label><select id="f-conc">
        ${concentrations.map(c => `<option value="${esc(c)}"${c===(p.conc || "") ? " selected" : ""}>${esc(concentrationLabel(c))}</option>`).join("")}
      </select></div>
      ${id ? "" : `<div class="duplicate-notice" id="f-duplicate"${duplicate ? "" : " hidden"}>${duplicateNotice(duplicate)}</div>`}
      <div class="field"><span class="label">這支是</span><div class="chips" id="f-own" role="group" aria-label="香水類型">${Object.entries(OWN_TYPES).map(([k,label]) =>

      <div class="field" id="f-tried-field"${p.own === "tried" ? "" : " hidden"}><label for="f-tried">試香日期</label>
        <input type="date" id="f-tried" value="${esc(p.triedOn || TODAY)}"></div>
      ${lookupEdition ? '<p class="version-status" id="version-status" role="status" hidden></p>' : ""}
      <details class="disclosure form-options">
        <summary>香調與 Fragrantica</summary>
        <div class="form-section">
          <a class="lookup-link" id="f-lookup" href="${esc(fragranticaSearch(p.brand,p.name))}" target="_blank" rel="noopener">搜尋 Fragrantica ↗</a>
          <div class="field"><label for="f-src">Fragrantica 香水頁網址</label>
            <div class="src-row"><input id="f-src" type="url" inputmode="url" value="${esc(p.source)}" placeholder="https://www.fragrantica.asia/perfume/…">
              <span id="f-src-preview">${fragranticaId(p.source) ? photo(p.photo ? {source:p.source} : p, "ph-sm") : ""}</span></div>
            <span class="small muted" id="f-src-hint">${srcHint(p.source)}</span>
          </div>
          <div class="field"><label for="f-score">Fragrantica 分數（滿分 5）</label>
            <input id="f-score" type="number" min="1" max="5" step="0.01" inputmode="decimal" value="${esc(p.fragranticaRating)}" placeholder="${esc(Store.bundle?.ratings?.[fragranticaId(p.source)] || "選填")}">
          </div>
          ${NOTE_FIELDS.map(([key,label]) => `<div class="field"><label for="f-note-${key}">${label}</label>
            <textarea id="f-note-${key}" rows="1">${esc(notes[key])}</textarea></div>`).join("")}

      <details class="disclosure form-options">
        <summary>推薦偏好與備註</summary>
