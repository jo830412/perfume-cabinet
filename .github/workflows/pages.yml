# 推上 main 就發布網站；發布前把 __APP_VERSION__ 換成「月/日 時:分 · commit」（台灣時間），
# App 上方會顯示這個版號，也靠 version.json 判斷手機上的是不是最新版。
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stamp version
        run: |
          VERSION="$(TZ=Asia/Taipei date '+%m/%d %H:%M') · ${GITHUB_SHA::7}"
          sed -i "s|__APP_VERSION__|${VERSION}|g" index.html version.json
          echo "Version: $VERSION"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
